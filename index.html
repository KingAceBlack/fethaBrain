sed.","defendant":"Once the court lacks jurisdiction, it must dismiss the suit."},"judicial_analysis":"The court held that jurisdiction is fundamental and absence renders proceedings null and void. Having found the suit statute barred, the court lacks jurisdiction to entertain it and must dismiss it.","holding":"The court lacks jurisdiction and the suit is dismissed.","ratio_decidendi":"A court lacking jurisdiction cannot entertain a suit and must dismiss it.","result":"Issue resolved in favour of the defendant; suit dismissed."}],"holdings":[{"issue_number":"1","issue":"Whether this action is statute barred","holding":"The action is statute barred under Section 2(a) of the Public Officers Protection Law Cap. P.17, Laws of Akwa Ibom State, 2000.","result":"Defendant's preliminary objection succeeds."},{"issue_number":"2","issue":"Whether this Court can dismiss this suit for lack of jurisdiction on account of being statute barred","holding":"The court lacks jurisdiction and the suit is dismissed.","result":"Suit dismissed."}],"ratio_decidendi":[{"issue":"Statute bar under Public Officers Protection Law","principle":"An action against a public officer for acts done in pursuance of public duty must be commenced within 3 months of the act, neglect, or default, unless it falls within recognized exceptions such as continuance of injury, which requires periodicity of payment.","application":"The claimant's suit was filed more than 3 months after the cause of action arose, and no exception applied.","holding":"Suit is statute barred and dismissed."}],"obiter_dicta":[],"legal_principles":[{"principle":"In determining whether a case is statute barred, the court is restricted to the writ of summons and statement of claim.","context":"Preliminary objection on statute bar.","source":"Kanu v. Enugu Broadcasting Service & Ors. (2014) 46 NLLR (Pt. 148) 243; Olora v. Adegbitte (2013) 1 NWLR (Pt. 1334) 45."},{"principle":"The motive or propriety of a public officer's act is irrelevan importance":"Key"},{"case_name":"Bello & Ors. v. Nigeria Customs Service Board","citation":"(2015) 53 NLLR (Pt. 179) 343 NIC","court":"National Industrial Court","year":2015,"proposition":"Continuance of injury requires periodicity of payment.","treatment":"Followed","cited_by":"Court","importance":"Key"},{"case_name":"Okafor v. A.G, Anambra State","citation":"(2001) FWLR (Pt. 58) 1127","court":"Supreme Court of Nigeria","year":2001,"proposition":"Definition of continuance of injury.","treatment":"Cited","cited_by":"Court","importance":"Supporting"},{"case_name":"Carrey v. Bermondsey Metropolitan Borough Council","citation":"(1903) 675 P. 447; 20 TLR 2","court":"English Court","year":1903,"proposition":"Definition of continuance of injury.","treatment":"Cited","cited_by":"Court","importance":"Supporting"},{"case_name":"Amamiwe v. The Local School Board","citation":"(1971) 2 NMLR 57","court":"Nigerian Court","year":1971,"proposition":"Definition of continuance of injury.","treatment":"Cited","cited_by":"Court","importance":"Supporting"},{"case_name":"Obiefuna v. Okoye","citation":"(1961) ALL NLR 357","court":"Supreme Court of Nigeria","year":1961,"proposition":"Definition of continuance of injury.","treatment":"Cited","cited_by":"Court","importance":"Supporting"},{"case_name":"Hon. Runyi Kanu (JP) & Ors. v. Attorney-General & Commissioner for Justice, Cross River State & Ors.","citation":"(2013) 32 NLLR (Pt. 91) 63 NIC","court":"National Industrial Court","year":2013,"proposition":"For exception of continuance of damage or injury, there must be periodicity of payment.","treatment":"Followed","cited_by":"Court","importance":"Key"},{"case_name":"LUTH & MB v. Adewole","citation":"[1998] 5 NWLR (Pt. 550) 406","court":"Supreme Court of Nigeria","year":1998,"proposition":"For periodical payments, cause of action accrues from date salaries are due not paid.","treatment":"Followed","cited_by":"Court","importance":"Key"},{"case_name":"Kayili v. Yilbuk","citation":"(2015) 61 N l Effiong"],"defendants":["Department of State Service (The State Security Services Abuja)"],"appellants":[],"respondents":[],"applicants":[],"interested_parties":[],"counsel":[{"name":"Felix Udom","represents":"Claimant"},{"name":"John Ekpe","represents":"Defendant"}]},"procedural_history":{"originating_proceedings":"Claimant instituted action via Amended Complaint with accompanying frontloaded documents filed on 5th June, 2014 against the defendants.","procedural_posture":"The suit was originally commenced in the Federal High Court Uyo on 9th December 2010 and later transferred to the National Industrial Court, Calabar Judicial Division.","previous_decisions":[],"interlocutory_applications":[],"appeals":[],"orders_before_trial":[],"procedural_events":["Claimant filed Amended Complaint on 5th June 2014.","Defendant filed Amended Statement of Defence dated 8th July 2014 on 14th July 2014.","Claimant filed Amended Reply to Defendant's Statement of Defence dated and filed on 28th October 2015.","Trial commenced on 5th November 2015 with claimant testifying as CW, adopting written statement on oath marked Exhibit C1 and tendering 13 other exhibits.","Defendant called one witness, Eriba Eyenmi.","Parties filed final written addresses.","Judgment delivered on 3rd March 2017."]},"facts":{"material_facts":["Claimant was employed by the defendant in 1982 and retired in 1996.","Claimant contends he retired with the rank of Assistant Security Officer (ASO).","Defendant contends claimant retired with the rank of Chief Detective (CD).","Claimant avers he was not paid his full monthly pension and commenced this action.","Defendant avers claimant was involved in Orderly Room trial for misconduct in 1994 and received punishment of severe reprimand which affected his promotion.","Defendant avers claimant rose to rank of Chief Detective on 1st January 1994 and was compulsorily retired with effect from 5th March 1996.","Defendant avers letter of retirement Ref. No. C200/32/T dated 5th March 1996 addressing claimant as ASO is erroneous and never emanated from defendant.","Defendant avers claimant's computerized arrears stood at #403,982.20 and monthly pension is #11,317.77.","Claimant avers he was exonerated from blame in Orderly Room trial and retired with clean record.","Claimant avers his promotion to ASO depended on achievements and performance during service."],"chronology":[{"date":"1982","event":"Claimant employed by defendant."},{"date":"1994","event":"Claimant involved in Orderly Room trial for misconduct; promoted to Chief Detective on 1st January 1994."},{"date":"5th March 1996","event":"Claimant compulsorily retired from service."},{"date":"9th December 2010","event":"Suit commenced in Federal High Court Uyo."},{"date":"5th June 2014","event":"Amended Complaint filed."},{"date":"5th November 2015","event":"Trial commenced."},{"date":"3rd March 2017","event":"Judgment delivered."}],"admitted_facts":["Claimant was employed by defendant in 1982.","Claimant retired in 1996.","Claimant receives a monthly pension from defendant."],"disputed_facts":["Whether claimant retired with the rank of Assistant Security Officer (ASO) or Chief Detective (CD).","Whether claimant was underpaid his pension.","Whether the letter of retirement Ref. No. C200/32/T dated 5th March 1996 was issued by defendant.","Whether claimant was promoted to ASO."],"background_facts":["Claimant was employed by defendant in 1982 and retired in 1996.","Claimant contends he retired with the rank of Assistant Security Officer (ASO).","Defendant contends claimant retired with the rank of Chief Detective (CD)."],"employment_relationship":"Claimant was an employee of the defendant from 1982 until his retirement in 1996.","contractual_relationship":"Employment relationship governed by terms of service of the Department of State Service.","documentary_evidence":["Exhibit C1: Claimant's written statement on oath.","Exhibit C3: Letter of retirement from service Ref. No. C200/32/T dated 5th March 1996.","Exhibit C4: Circular No. B63216/S.1/13/105 of 20th January 1997.","Exhibit C5: Circular No. S.1549/10 of 23rd February 2001.","Exhibit C6: Letter from defendants to claimant dated 20th October 1993.","Exhibit C7-C7(5): Six letters from defendants to different persons dated 23rd February 2001.","Exhibit C8: Letter from defendants dated 15th July 2013 to Association of Retired Officers.","Exhibit C9: Letter from National Pension Commission to Daniel & Daniel Attorneys.","Exhibit C10: Certified true copy of Circular Ref SWC/S/04/S.08/Vol. IV/207 of 5th August 2010.","Exhibit C11: Photocopy of government circular B.63216/S.1/X/840 of 5th October 2000.","Exhibit C12: Letter written by claimant to defendants on 13th March 2008.","Exhibit C14: Computer generated Bank Statement of Accounts."],"witness_evidence":["Claimant testified as CW and adopted his written statement on oath.","Defendant called one witness, Eriba Eyenmi, of the defendant's Personnel Department."]},"claims_and_reliefs":{"causes_of_action":["Underpayment of pension","Discrimination in pension payment"],"claims":[{"claim":"Declaration that it is wrongful, unlawful and unconstitutional for the defendant to discriminate against the claimant by not paying him a monthly pension of #40,638.93 but pays a smaller amount of #13,792.10 contrary to periodical increments done by the Federal Government of Nigeria for retired Federal workers.","legal_basis":"Constitutional provisions, pension laws","claimant":"Pastor Akpan Samuel Effiong","against":"Department of State Service"},{"claim":"Order directing the defendant to pay the claimant the sum of #4,318,642.46 representing unpaid arrears of pension from 1999 till September, 2013.","legal_basis":"Pension entitlement","claimant":"Pastor Akpan Samuel Effiong","against":"Department of State Service"},{"claim":"Exemplary damages of #5,000,000.00 against the defendant.","legal_basis":"Exemplary damages","claimant":"Pastor Akpan Samuel Effiong","against":"Department of State Service"},{"claim":"#1,700,000.00 being the cost of this suit.","legal_basis":"Costs","claimant":"Pastor Akpan Samuel Effiong","against":"Department of State Service"}],"reliefs_sought":[{"relief_number":"1","relief":"A DECLARATION that it is wrongful, unlawful and unconstitutional for the defendant to discriminate against the claimant by not paying him a monthly pension of #40,638.93 but pays a smaller amount of #13,792.10 contrary to periodical increments done by the Federal Government of Nigeria for the retired Federal workers.","category":"Declaration"},{"relief_number":"2","relief":"AN ORDER of Court directing the defendant to pay the claimant the sum of #4,318,642.46 (Four Million, Three Hundred and Eighteen Thousand, Six Hundred and Forty Two Naira, Forty Six Kobo) only which represents the unpaid arrears of pension accruable to the claimant from 1999 till September, 2013.","category":"Monetary Order"},{"relief_number":"3","relief":"Exemplary damages of #5,000,000.00 (Five Million Naira) against the defendant.","category":"Damages"},{"relief_number":"4","relief":"#1,700,000.00 being the cost of this suit.","category":"Costs"}],"issues_for_determination":[{"issue_number":"1","issue":"Whether based on the available facts and evidence before this Honorable Court the claimant is entitled to his reliefs.","raised_by":"Court"},{"issue_number":"2","issue":"Whether the suit of the claimant is competent in view of the Limitation Law i.e. Sec. 2 (a) of the Public Officers Protection Act, LFN, 2004.","raised_by":"Defendant"}],"questions_of_law":["Whether the suit is statute barred under Section 2(a) of the Public Officers Protection Act.","Whether the claimant has proved entitlement to pension as an Assistant Security Officer."]},"arguments":{"claimant_arguments":["Claimant is entitled to his reliefs as he has proved his case by adducing credible evidence.","It is not necessary to tender the letter of promotion as the letter of retirement is sufficient.","The defendant ought to have tendered the letter of clearance because payment of entitlements depended upon issuance of clearance letter.","Exhibit C5 is an original private document and Exhibit C11 contains useful private documents that will assist the Court.","The case is competent and not affected by the Public Officers Protection Act as the cause of action bothers on debt.","Claimant retired as an ASO and is entitled to be paid #40,638.13 as monthly pension.","The defendant has not entered appearance in this case.","The defendant's address filed on 2nd August, 2016 is incompetent for non-compliance with Rule 10 of Professional Conduct for Legal Practitioners, 2007."],"defendant_arguments":["Claimant is not entitled to the reliefs sought as he who asserts must prove his case with credible and unchallenged evidence.","Declaratory relief falls within the discretionary power of the Court.","Claimant ought to have called the maker of Exhibit C3 as a witness.","Exhibits C4, C5, C7, C9, C10, C11 & C12 are public documents that require certification before admission into evidence.","Exhibit C14 is a computer generated document that did not comply with Section 84 of the Evidence Act, 2011.","Claimant has not led any evidence in proof of the claim that his alleged non-payment has infringed on his constitutional rights.","The suit is statute barred under Section 2(a) of the Public Officers Protection Act as the cause of action arose in 1999.","The defendant is not indebted to the claimant in any way."],"appellant_arguments":[],"respondent_arguments":[],"submissions":[],"party_authorities":[{"party":"Defendant","authority":"Section 131 of the Evidence Act, 2011","proposition":"He who asserts must prove his case with credible and unchallenged evidence."},{"party":"Defendant","authority":"Elias v. Disu (1962) 1 SCNLR 361","proposition":"Party who wishes to succeed must adduce credible evidence to establish his case."},{"party":"Defendant","authority":"Section 2(a) of the Public Officers Protection Act, LFN, 2004","proposition":"Action must be commenced within three months next after the act complained of."},{"party":"Claimant","authority":"Section 173(2) & (3) of the 1999 Constitution","proposition":"Compliance with constitutional provisions for periodical increments of monthly pensions."},{"party":"Claimant","authority":"Central Bank of Nigeria v. Amao & 2 Ors. (2011) ALL FWLR (Pt. 558) 805","proposition":"Cause of action in this case bothers on debt."}]},"evidence":{"exhibits":[{"identifier":"C1","description":"Claimant's written statement on oath","party":"Claimant","relevance":"Claimant's evidence-in-chief"},{"identifier":"C3","description":"Letter of retirement from service Ref. No. C200/32/T dated 5th March 1996","party":"Claimant","relevance":"Evidence of retirement rank"},{"identifier":"C4","description":"Circular No. B63216/S.1/13/105 of 20th January 1997","party":"Claimant","relevance":"Alleged pension increment"},{"identifier":"C5","description":"Circular No. S.1549/10 of 23rd February 2001","party":"Claimant","relevance":"Alleged pension increment"},{"identifier":"C6","description":"Letter from defendants to claimant dated 20th October 1993","party":"Claimant","relevance":"Petition against alleged victimization"},{"identifier":"C7-C7(5)","description":"Six letters from defendants to different persons dated 23rd February 2001","party":"Claimant","relevance":"Pension recalculation of others"},{"identifier":"C8","description":"Letter from defendants dated 15th July 2013 to Association of Retired Officers","party":"Claimant","relevance":"Update on outstanding pension issues"},{"identifier":"C9","description":"Letter from National Pension Commission to Daniel & Daniel Attorneys","party":"Claimant","relevance":"Referral of complaint to defendants"},{"identifier":"C10","description":"Certified true copy of Circular Ref SWC/S/04/S.08/Vol. IV/207 of 5th August 2010","party":"Claimant","relevance":"Pension harmonization"},{"identifier":"C11","description":"Photocopy of government circular B.63216/S.1/X/840 of 5th October 2000","party":"Claimant","relevance":"Alleged pension increment"},{"identifier":"C12","description":"Letter written by claimant to defendants on 13th March 2008","party":"Claimant","relevance":"Claimant's complaint"},{"identifier":"C14","description":"Computer generated Bank Statement of Accounts","party":"Claimant","relevance":"Evidence of pension payments received"}],"witnesses":[{"name":"Pastor Akpan Samuel Effiong","party":"Claimant","role":"Claimant","evidence_summary":"Testified that he was employed in 1982, retired in 1996 as ASO, and was underpaid his pension."},{"name":"Eriba Eyenmi","party":"Defendant","role":"Defendant's witness","evidence_summary":"Testified on behalf of the defendant regarding claimant's rank and pension."}],"documentary_evidence":[],"oral_evidence":[],"expert_evidence":[],"evidential_findings":[{"evidence":"Exhibit C3 - Letter of retirement addressing claimant as ASO","finding":"Insufficient to establish that claimant was promoted to ASO.","credibility":"Low"},{"evidence":"Exhibits C4, C5, C7, C9, C10, C11 & C12","finding":"Some were public documents requiring certification; some were unreliable; some were not tied to claimant's case.","credibility":"Low"},{"evidence":"Exhibit C14 - Bank statement","finding":"Admitted but not tied to claimant's claim.","credibility":"Low"}]},"judicial_analysis":{"findings_of_fact":[{"issue":"Claimant's rank at retirement","finding":"Claimant did not provide evidence of promotion to ASO; defendant's contention that he retired as Chief Detective is more credible."},{"issue":"Underpayment of pension","finding":"Claimant failed to provide evidence of what the ASO pension was or that he was entitled to it."}],"findings_of_law":[{"issue":"Statute barred","finding":"The suit is not statute barred because the cause of action is continuing injury (periodic pension payments)."},{"issue":"Admissibility of computer generated evidence","finding":"The court may depart from the Evidence Act in the interest of justice; Exhibit C14 remains admitted."}],"reasoning":"The court found that the claimant failed to establish the fundamental basis of his claim, specifically that he was promoted to ASO. The letter of retirement alone was insufficient. The court also found that the suit was not statute barred due to continuing injury. The court dismissed the suit.","issue_analysis":[{"issue_number":"1","issue":"Whether based on the available facts and evidence before this Honorable Court the claimant is entitled to his reliefs.","arguments":{"claimant":"Claimant argued he was entitled to reliefs as he proved his case and retired as ASO.","defendant":"Defendant argued claimant failed to prove his case and was not entitled to reliefs."},"judicial_analysis":"The court found that the claimant failed to prove that he was promoted to ASO. The letter of retirement alone was insufficient. The claimant also failed to provide evidence of the pension entitlement of an ASO.","holding":"Claimant is not entitled to the reliefs sought.","ratio_decidendi":"A claimant must prove the basis of his claim; mere assertion without evidence is insufficient.","result":"Claim dismissed."},{"issue_number":"2","issue":"Whether the suit of the claimant is competent in view of the Limitation Law i.e. Sec. 2 (a) of the Public Officers Protection Act, LFN, 2004.","arguments":{"claimant":"Claimant argued the suit is competent and not affected by the Public Officers Protection Act as the cause of action is debt.","defendant":"Defendant argued the suit is statute barred as the cause of action arose in 1999."},"judicial_analysis":"The court found that the cause of action is underpayment of pension, which is a continuing injury, and thus falls within the exception to the limitation law.","holding":"The suit is not statute barred.","ratio_decidendi":"For the exception of continuance of damage or injury to apply, there must be periodicity of payment, such as monthly pension.","result":"Suit not statute barred."}],"holdings":[{"issue_number":"1","issue":"Entitlement to reliefs","holding":"Claimant failed to prove entitlement to reliefs.","result":"Claim dismissed."},{"issue_number":"2","issue":"Statute barred","holding":"Suit is not statute barred.","result":"Jurisdiction upheld."}],"ratio_decidendi":[{"issue":"Proof of promotion","principle":"Promotion in employment law is a factual situation that cannot be inferred or attributed; it must be proved.","application":"Claimant failed to prove he was promoted to ASO.","holding":"Claimant's claim fails."},{"issue":"Continuing injury exception","principle":"The exception of continuance of damage or injury to limitation law applies where there is periodicity of payment, such as monthly pension.","application":"Claimant's pension is paid monthly, so the suit is not statute barred.","holding":"Suit not statute barred."}],"obiter_dicta":[],"legal_principles":[{"principle":"He who asserts must prove.","context":"Claimant alleged underpayment but failed to prove entitlement.","source":"Section 131 of the Evidence Act, 2011"},{"principle":"Promotion is neither automatic nor as of right.","context":"Claimant alleged promotion to ASO but no evidence.","source":"Abenga v. Benue State Judicial Service Commission [2006] 14 NWLR (Pt. 1000) 610 CA"}],"statutory_interpretation":[{"statute":"Public Officers Protection Act, LFN, 2004","provision":"Section 2(a)","interpretation":"Action must be commenced within three months next after the act complained of, unless there is continuance of damage or injury.","application":"Court found continuing injury due to periodic pension payments, so suit not statute barred."},{"statute":"Evidence Act, 2011","provision":"Section 84","interpretation":"Computer generated documents must be certified.","application":"Court departed from this provision in the interest of justice under Section 12(2) of the NIC Act 2006."}],"constitutional_analysis":[{"provision":"Section 173(2) & (3) of the 1999 Constitution","interpretation":"Pension rights of public officers.","application":"Claimant relied on this but failed to prove entitlement."}],"precedent_analysis":[{"authority":"Federal Airports Authority v. Nwoye (2015) 53 NLLR (Pt. 180) 446 CA","citation":"(2015) 53 NLLR (Pt. 180) 446 CA","treatment":"Followed","proposition":"Jurisdiction is a threshold matter.","reasoning":"Court applied this to address the statute barred issue first."},{"authority":"Bello & Ors. v. Nigeria Customs Service Board (2015) 53 NLLR (Pt. 179) 343 NIC","citation":"(2015) 53 NLLR (Pt. 179) 343 NIC","treatment":"Followed","proposition":"For continuing injury exception, there must be periodicity of payment.","reasoning":"Court applied this to hold the suit not statute barred."}],"evidential_findings":[],"judicial_observations":[]},"authorities":{"cases_cited":[{"case_name":"Elias v. Disu","citation":"(1962) 1 SCNLR 361","court":"Supreme Court","year":1962,"proposition":"He who asserts must prove.","treatment":"Cited","cited_by":"Defendant","importance":"High"},{"case_name":"Arase v. Arase","citation":"(1987) 5 SC 33","court":"Supreme Court","year":1987,"proposition":"Party must adduce credible evidence to establish his case.","treatment":"Cited","cited_by":"Defendant","importance":"Medium"},{"case_name":"Elias v. Omo-Bare","citation":"(1982) 5 SC 291","court":"Supreme Court","year":1982,"proposition":"Party must adduce credible evidence to establish his case.","treatment":"Cited","cited_by":"Defendant","importance":"Medium"},{"case_name":"Nzurike v. Obioha","citation":"(2011) LPELR 4661 (CA)","court":"Court of Appeal","year":2011,"proposition":"Declaratory relief falls within the discretionary power of the Court.","treatment":"Cited","cited_by":"Defendant","importance":"Medium"},{"case_name":"A.G. Cross River State v. A.G. Federation","citation":"(2005) 6 SCNJ 152","court":"Supreme Court","year":2005,"proposition":"Declaratory r e":"2010-06-22","event":"Claimant summarily dismissed via letter (Exhibit G)."},{"date":"2011-11-28","event":"Complaint filed."},{"date":"2013-07-17","event":"Judgment delivered."}],"admitted_facts":[],"disputed_facts":[],"background_facts":["Defendant Bank formerly known as International Bank for West Africa Ltd and Afribank Nigeria Plc, now Mainstreet Bank Ltd by order of Central Bank of Nigeria.","Claimant's employment governed by collective agreement (Exhibit D) between ASSBIFI and NEABIA."],"employment_relationship":"Claimant was an employee of the defendant Bank from 13th January 1981 until summary dismissal on 22nd June 2010, serving 29 years.","contractual_relationship":"Employment contract incorporated collective agreement (Exhibit D) as part of terms and conditions of service.","documentary_evidence":["Exhibit A: Letter of appointment dated 9th April 1981.","Exhibit B: Letter confirming appointment dated 19th October 1981.","Exhibit C: Promotion letter dated 19th November 2007.","Exhibit D: Collective agreement.","Exhibit G: Summary dismissal letter dated 22nd June 2010.","Exhibit H: Statement of Account of Retirement Savings with Trust Fund.","Exhibits I, J, K, L: Pay-slips evidencing payment of ASSBIFI membership dues.","Exhibits M, N: Additional documents."],"witness_evidence":["Claimant testified as CW and tendered Exhibits A–N. Defendant did not cross-examine CW."]},"claims_and_reliefs":{"causes_of_action":["Wrongful summary dismissal","Breach of collective agreement","Failure to give notice or salary in lieu"],"claims":[{"claim":"Declaration that summary dismissal is wrongful, null and void.","legal_basis":"Breach of collective agreement and conditions of service.","claimant":"Joseph Chidubem Nwachukwu","against":"Mainstreet Bank Limited"},{"claim":"Order changing summary dismissal to termination.","legal_basis":"Wrongful dismissal.","claimant":"Joseph Chidubem Nwachukwu","against":"Mainstreet Bank Limited"},{"claim":"Payment of N1,624,926.66 being 3 months' salary in lieu of notice as damages.","legal_basis":"Terms of employment.","claimant":"Joseph Chidubem Nwachukwu","against":"Mainstreet Bank Limited"},{"claim":"Payment of N33,073,597.52 being terminal benefits (16 weeks of total emoluments for each completed year of service, 29 years).","legal_basis":"Collective agreement.","claimant":"Joseph Chidubem Nwachukwu","against":"Mainstreet Bank Limited"},{"claim":"Payment of current pension savings held by Trustfund.","legal_basis":"Pension scheme.","claimant":"Joseph Chidubem Nwachukwu","against":"Mainstreet Bank Limited"},{"claim":"Payment of retirement contributions held by defendant.","legal_basis":"Pension scheme.","claimant":"Joseph Chidubem Nwachukwu","against":"Mainstreet Bank Limited"}],"reliefs_sought":[{"relief_number":"1","relief":"Declaration that summary dismissal vide letter dated June 22, 2010, ref. HCM/IRSW/24224/2010 is wrongful, null and void.","category":"Declaration"},{"relief_number":"2","relief":"Order changing summary dismissal to termination.","category":"Order"},{"relief_number":"3","relief":"Order directing defendant to pay N1,624,926.66 being 3 months' salary in lieu of notice as damages.","category":"Damages"},{"relief_number":"4","relief":"Order directing defendant to pay N33,073,597.52 being terminal benefits (16 weeks of total emoluments for each completed year of service, 29 years).","category":"Terminal benefits"},{"relief_number":"5","relief":"Order directing current pension savings held by Trustfund be paid to claimant.","category":"Pension"},{"relief_number":"6","relief":"Order directing retirement contributions held by defendant be paid to claimant.","category":"Pension"}],"issues_for_determination":[{"issue_number":"a","issue":"Whether from the totality of evidence, unchallenged, claimant is entitled to judgment.","raised_by":"Claimant"},{"issue_number":"b","issue":"Whether from totality of evidence, claimant proved his case to entitle him to judgment.","raised_by":"Claimant"}],"questions_of_law":["Whether 'your services are no longer required' is a reason for dismissal or the act of dismissal.","Whether employer must state reasons for termination or dismissal.","Whether failure to comply with disciplinary procedure in collective agreement renders dismissal null and void."]},"arguments":{"claimant_arguments":["Defendant did not file defence or cross-examine CW, so evidence is unchallenged and deemed admitted.","Burden of proof is minimal where evidence is unchallenged.","Summary dismissal was wrongful as it violated collective agreement (Exhibit D) which requires query and opportunity to defend before dismissal.","The reason 'services no longer required' is not a ground for summary dismissal under the collective agreement.","Claimant is entitled to terminal benefits, pension, and retirement contributions."],"defendant_arguments":[],"appellant_arguments":[],"respondent_arguments":[],"submissions":["Claimant submitted that unchallenged evidence requires minimal proof, citing Kosile v. Folarin and Nigerian Bottling Company Plc v. Abubakar.","Claimant submitted that collective agreement incorporated into contract of employment must be followed, citing Planned Parenthood Federation of Nigeria v. Shogbola and Tomlirison v. Lmssr."],"party_authorities":[{"party":"Claimant","authority":"Kosile v. Folarin [1961] 2 SCNLR 233","proposition":"Where evidence is unchallenged, onus of proof is discharged on minimum proof."},{"party":"Claimant","authority":"Nigerian Bottling Company Plc & anor v. Mallam Ibrahim Abubakar [2006] 16 WRN 175","proposition":"Unchallenged evidence requires minimal proof."},{"party":"Claimant","authority":"The Registered Trustees of the Planned Parenthood Federation of Nigeria & anor v. Dr. Jimmy Shogbola [2005] 1 WRN 15","proposition":"Collective agreement incorporated into contract must be followed; breach renders termination wrongful."},{"party":"Claimant","authority":"Tomlirison v. Lmssr [1944] 1 All ER 537","proposition":"Steps in collective agreement for determination must be followed."}]},"evidence":{"exhibits":[{"identifier":"A","description":"Letter of appointment dated 9th April 1981.","party":"Claimant","relevance":"Establishes employment and incorporation of collective agreement."},{"identifier":"B","description":"Letter confirming appointment dated 19th October 1981.","party":"Claimant","relevance":"Confirms employment."},{"identifier":"C","description":"Promotion letter dated 19th November 2007.","party":"Claimant","relevance":"Shows promotion to Senior Assistant Manager."},{"identifier":"D","description":"Collective agreement.","party":"Claimant","relevance":"Governs conditions of service and disciplinary procedure."},{"identifier":"G","description":"Summary dismissal letter dated 22nd June 2010.","party":"Claimant","relevance":"Subject of complaint."},{"identifier":"H","description":"Statement of Account of Retirement Savings with Trust Fund.","party":"Claimant","relevance":"Pension savings evidence (not readable)."},{"identifier":"I","description":"Pay-slip August 1995.","party":"Claimant","relevance":"Evidence of ASSBIFI membership dues."},{"identifier":"J","description":"Pay-slip December 2004.","party":"Claimant","relevance":"Evidence of ASSBIFI membership dues."},{"identifier":"K","description":"Pay-slip January 2009.","party":"Claimant","relevance":"Evidence of ASSBIFI membership dues."},{"identifier":"L","description":"Pay-slip April 2009.","party":"Claimant","relevance":"Evidence of ASSBIFI membership dues."},{"identifier":"M","description":"Additional document.","party":"Claimant","relevance":"Evidence of ASSBIFI membership dues."},{"identifier":"N","description":"Additional document.","party":"Claimant","relevance":"Evidence of ASSBIFI membership dues."}],"witnesses":[{"name":"Joseph Chidubem Nwachukwu","party":"Claimant","role":"Claimant witness (CW)","evidence_summary":"Testified to employment history, membership of ASSBIFI, payment of dues, and summary dismissal without query or notice."}],"documentary_evidence":["Exhibits A–N as listed."],"oral_evidence":["Claimant's testimony as CW."],"expert_evidence":[],"evidential_findings":[{"evidence":"Claimant's unchallenged testimony and exhibits.","finding":"Claimant was a financial member of ASSBIFI and his conditions of service governed by collective agreement.","credibility":"Unchallenged, credible."},{"evidence":"Exhibit G dismissal letter.","finding":"Claimant was summarily dismissed without query or opportunity to defend.","credibility":"Documentary evidence."}]},"judicial_analysis":{"findings_of_fact":[{"issue":"Membership of ASSBIFI","finding":"Claimant was a financial member of ASSBIFI."},{"issue":"Compliance with disciplinary procedure","finding":"No evidence that claimant was given written query or opportunity to defend before dismissal."},{"issue":"Reason for dismissal","finding":"The phrase 'your services are no longer required' is the act of dismissal, not the reason."}],"findings_of_law":[{"issue":"Employer's duty to state reasons","finding":"Employer need not state reasons for termination or dismissal."},{"issue":"Effect of non-compliance with collective agreement","finding":"Dismissal not in accordance with conditions of service is wrongful, unlawful, null and void."},{"issue":"Entitlement to notice","finding":"Collective agreement provides for one month's salary in lieu of notice, not three months."}],"reasoning":"The Court found that the claimant's employment was governed by the collective agreement (Exhibit D) which required a written query and opportunity to defend before summary dismissal. The defendant failed to comply. The dismissal was therefore wrongful, unlawful, null and void. The Court distinguished between termination and dismissal, noting dismissal carries infamy. The Court held that the claimant was entitled to reliefs 1 and 2, and to one month's salary in lieu of notice as per the collective agreement. Reliefs 4, 5, and 6 were deemed abandoned for lack of proof.","issue_analysis":[{"issue_number":"1","issue":"Whether the summary dismissal was wrongful, null and void.","arguments":{"claimant":"Dismissal violated collective agreement as no query or opportunity to defend was given; reason 'services no longer required' not a ground for summary dismissal.","defendant":"No arguments presented."},"judicial_analysis":"The Court found that the collective agreement (Exhibit D) was incorporated into the contract of employment. Article 4(iv)(c) required a written query and opportunity to defend before summary dismissal. No evidence of compliance. The dismissal was therefore not in accordance with the conditions of service.","holding":"Summary dismissal is wrongful, null and void.","ratio_decidendi":"Where a collective agreement incorporated into a contract of employment prescribes a disciplinary procedure, failure to comply renders the dismissal null and void.","result":"Relief 1 granted."},{"issue_number":"2","issue":"Whether summary dismissal should be changed to termination.","arguments":{"claimant":"Dismissal should be converted to termination to remove infamy and allow terminal benefits.","defendant":"No arguments presented."},"judicial_analysis":"The Court noted the distinction between dismissal and termination. Dismissal carries infamy and deprives terminal benefits. Since the dismissal was wrongful, it should be changed to termination.","holding":"Summary dismissal changed to termination.","ratio_decidendi":"A wrongful dismissal may be converted to termination to mitigate the opprobrium and allow terminal benefits.","result":"Relief 2 granted."},{"issue_number":"3","issue":"Whether claimant is entitled to 3 months' salary in lieu of notice.","arguments":{"claimant":"Entitled to 3 months' salary in lieu of notice as per terms of employment.","defendant":"No arguments presented."},"judicial_analysis":"The Court examined Exhibit D and found that Article 4(ii)(d) provides for one month's notice or salary in lieu, not three months. The claimant's claim for three months was not supported by the collective agreement.","holding":"Claimant entitled to one month's salary in lieu of notice, not three months.","ratio_decidendi":"Entitlement to notice period is governed by the express terms of the collective agreement.","result":"Relief 3 partially granted; awarded N541,642.22 (one month's salary)."}],"holdings":[{"issue_number":"1","issue":"Wrongful dismissal","holding":"Summary dismissal is wrongful, null and void.","result":"Relief 1 granted."},{"issue_number":"2","issue":"Conversion to termination","holding":"Summary dismissal changed to termination.","result":"Relief 2 granted."},{"issue_number":"3","issue":"Salary in lieu of notice","holding":"Claimant entitled to one month's salary in lieu of notice.","result":"Relief 3 partially granted; N541,642.22 awarded."},{"issue_number":"4","issue":"Terminal benefits","holding":"Relief 4 deemed abandoned.","result":"Struck out."},{"issue_number":"5","issue":"Pension savings","holding":"Relief 5 deemed abandoned.","result":"Struck out."},{"issue_number":"6","issue":"Retirement contributions","holding":"Relief 6 deemed abandoned.","result":"Struck out."}],"ratio_decidendi":[{"issue":"Compliance with disciplinary procedure","principle":"Where a collective agreement incorporated into a contract of employment prescribes a disciplinary procedure, failure to comply renders the dismissal null and void.","application":"Defendant failed to give written query and opportunity to defend before summary dismissal.","holding":"Dismissal wrongful, null and void."},{"issue":"Notice period","principle":"Entitlement to notice period is governed by the express terms of the collective agreement.","application":"Collective agreement provided for one month's salary in lieu of notice, not three months.","holding":"Claimant entitled to one month's salary in lieu of notice."}],"obiter_dicta":[{"statement":"Dismissal of an employee carries infamy and unflattering opprobrium, and hence deprives the employee his terminal benefits.","context":"Discussion on distinction between termination and dismissal.","relevance":"Supports conversion of dismissal to termination."}],"legal_principles":[{"principle":"Employer need not state reasons for termination or dismissal.","context":"Consideration of whether 'services no longer required' is a reason.","source":"Ihezukwu v. University of Jos [1990] 4 NWLR (Pt. 146) 598 SC; ACB Plc v. Nbisike [1995] 8 NWLR (Pt. 416) 725 CA."},{"principle":"Unchallenged evidence requires minimal proof.","context":"Defendant did not file defence or cross-examine CW.","source":"Kosile v. Folarin [1961] 2 SCNLR 233; Nigerian Bottling Company Plc v. Abubakar [2006] 16 WRN 175."},{"principle":"Collective agreement incorporated into contract of employment is binding.","context":"Exhibit A incorporated collective agreement.","source":"Oguejiofor v. Siemens Ltd [2008] 2 NWLR (Pt. 1071) 283."}],"statutory_interpretation":[{"statute":"National Industrial Court (NIC) Act 2006","provision":"Section 19(d)","interpretation":"Empowers Court to award compensation or damages.","application":"Used to award one month's salary in lieu of notice."},{"statute":"Evidence Act 2011","provision":"Section 133(4)","interpretation":"Burden of proof.","application":"Claimant discharged burden with unchallenged evidence."}],"constitutional_analysis":[],"precedent_analysis":[{"authority":"Ihezukwu v. University of Jos","citation":"[1990] 4 NWLR (Pt. 146) 598 SC","treatment":"Followed","proposition":"Employer need not state reasons for termination or dismissal.","reasoning":"Applied to hold that 'services no longer required' is not a reason."},{"authority":"ACB Plc v. Nbisike","citation":"[1995] 8 NWLR (Pt. 416) 725 CA","treatment":"Followed","proposition":"Employer need not allege specific act of misconduct for dismissal.","reasoning":"Applied but distinguished as not applicable to instant case."},{"authority":"J. A. Irem v. Obubra District Counsel","citation":"[1960] 5 FSC 24","treatment":"Followed","proposition":"Dismissal carries infamy and deprives benefits.","reasoning":"Applied to distinguish dismissal from termination."},{"authority":"Jombo v. PEFMB","citation":"[2005] 14 NWLR (Pt. 945) 443 SC","treatment":"Followed","proposition":"Dismissal is punitive and entails loss of terminal benefits.","reasoning":"Applied to support conversion to termination."},{"authority":"Habu v. NUT Taraba State","citation":"[2005] 4 FWLR (Pt. 283) 646","treatment":"Followed","proposition":"Deduction of check-off dues is incidence of membership.","reasoning":"Used to find claimant was financial member of ASSBIFI."},{"authority":"Andrew Monye v. Ecobank Nigeria Plc","citation":"unreported Suit No. NIC/LA/06/2010","treatment":"Followed","proposition":"Termination in sensitive sector suggests wrongdoing; compensation may be awarded.","reasoning":"Reinforced finding that dismissal was wrongful."},{"authority":"Industrial Cartons Ltd v. NUPAPPW","citation":"[2006] 6 NLLR (Pt. 15) 258","treatment":"Followed","proposition":"Where reason for termination is incorrect, one month's salary in lieu is inadequate compensation.","reasoning":"Considered in awarding compensation."},{"authority":"Oguejiofor v. Siemens Ltd","citation":"[2008] 2 NWLR (Pt. 1071) 283","treatment":"Followed","proposition":"Collective agreement incorporated into contract of employment is binding.","reasoning":"Applied to hold Exhibit D binding."}],"evidential_findings":[],"judicial_observations":["The defendant's absence did not absolve the claimant of the duty to prove his case on the minimal evidence rule.","Reliefs 4, 5, and 6 were not argued and were deemed abandoned."]},"authorities":{"cases_cited":[{"case_name":"Attorney General, Osun State v. Nigeria Labour Congress (Osun State Council) & ors","citation":"unreported Suit No. NICN/LA/275/2012","court":"National Industrial Court","year":2012,"proposition":"Where defendant is absent, claimant may tance":"Substantive"},{"case_name":"ACB Plc v. Nbisike","citation":"[1995] 8 NWLR (Pt. 416) 725 CA","court":"Court of Appeal","year":1995,"proposition":"Employer need not allege specific act of misconduct for dismissal.","treatment":"Followed","cited_by":"Court","importance":"Substantive"},{"case_name":"J. A. Irem v. Obubra District Counsel","citation":"[1960] 5 FSC 24","court":"Federal Supreme Court","year":1960,"proposition":"Dismissal carries infamy and deprives benefits.","treatment":"Followed","cited_by":"Court","importance":"Substantive"},{"case_name":"Jombo v. PEFMB","citation":"[2005] 14 NWLR (Pt. 945) 443 SC","court":"Supreme Court","year":2005,"proposition":"Dismissal is punitive and entails loss of terminal benefits.","treatment":"Followed","cited_by":"Court","importance":"Substantive"},{"case_name":"Habu v. NUT Taraba State","citation":"[2005] 4 FWLR (Pt. 283) 646","court":"Court of Appeal","year":2005,"proposition":"Deduction of check-off dues is incidence of membership.","treatment":"Followed","cited_by":"Court","importance":"Evidential"},{"case_name":"Andrew Monye v. Ecobank Nigeria Plc","citation":"unreported Suit No. NIC/LA/06/2010","court":"National Industrial Court","year":2011,"proposition":"Termination in sensitive sector suggests wrongdoing.","treatment":"Followed","cited_by":"Court","importance":"Substantive"},{"case_name":"Industrial Cartons Ltd v. NUPAPPW","citation":"[2006] 6 NLLR (Pt. 15) 258","court":"National Industrial Court","year":2006,"proposition":"Where reason for termination is incorrect, one month's salary in lieu is inadequate compensation.","treatment":"Followed","cited_by":"Court","importance":"Substantive"},{"case_name":"Oguejiofor v. Siemens Ltd","citation":"[2008] 2 NWLR (Pt. 1071) 283","court":"Supreme Court","year":2008,"proposition":"Collective agreement incorporated into contract of employment is binding.","treatment":"Followed","cited_by":"Court","importance":"Substantive"}],"statutes":[{"name":"National Industrial Cou ck of proof."},{"relief_number":"5","relief":"Payment of pension savings held by Trustfund.","result":"Struck out","reason":"Deemed abandoned for lack of proof."},{"relief_number":"6","relief":"Payment of retirement contributions held by defendant.","result":"Struck out","reason":"Deemed abandoned for lack of proof."}],"reliefs_granted":["Relief 1","Relief 2"],"reliefs_refused":[],"reliefs_struck_out":["Relief 4","Relief 5","Relief 6"],"reliefs_dismissed":[],"damages":[{"type":"Salary in lieu of notice","amount":"541,642.22","currency":"NGN","recipient":"Joseph Chidubem Nwachukwu"}],"compensation":[],"costs":{"awarded":true,"amount":"20,000","recipient":"Joseph Chidubem Nwachukwu","details":"Cost payable by defendant to claimant."},"interest":{"awarded":false,"rate":"","start_date":"","end_date":"","basis":""},"compliance_deadline":"30 days from judgment date","declarations":["Summary dismissal is wrongful, null and void."],"injunctions":[],"specific_orders":["Summary dismissal changed to termination.","Payment of N541,642.22 as one month's salary in lieu of notice."],"final_disposition":"Claim partially succeeded. Judgment entered accordingly."},"legal_knowledge":{"holdings":["Summary dismissal without compliance with disciplinary procedure in collective agreement is null and void.","Employer need not state reasons for termination or dismissal.","Collective agreement incorporated into contract of employment is binding.","Unchallenged evidence requires minimal proof.","Dismissal carries infamy and deprives terminal benefits; termination does not."],"legal_principles":["Compliance with disciplinary procedure in collective agreement is mandatory.","Employer's duty to state reasons for dismissal is not required by law.","Unchallenged evidence requires minimal proof.","Collective agreement incorporated into contract is binding.","Dismissal vs termination distinction."],"ratio_decidendi":["Failure to comply with disciplinary procedure in collective agreement renders dism Technology Acquisition and Promotion (NOTAP) and Others","case_number":"NICN/ABJ/192m/2014","court":"National Industrial Court of Nigeria","judicial_division":"Abuja","judge":"Hon. Justice P.O Lifu (JP)","judgment_date":"2014-11-17","year":2014,"claimants":["Engr. Soibi Dede (PHD)"],"defendants":["National Office for Technology Acquisition and Promotion (NOTAP) and Others"],"appellants":[],"respondents":[],"applicants":[],"interested_parties":[],"counsel":[{"name":"Micheal Eleyinmi","represents":"Claimant/Respondent"},{"name":"C. I. Okpoko","represents":"Defendant/Applicant"}]},"procedural_history":{"originating_proceedings":"Motion on notice brought pursuant to Order II Rule 10 and Order 30 (1) of the National Industrial Court (NIC) Rules 2007 and under the inherent jurisdiction of the court, seeking stay of execution of judgment delivered on 20th May 2014 pending appeal.","procedural_posture":"Ruling on application for stay of execution and oral application to withdraw same.","previous_decisions":["Judgment delivered by this court on 20th May 2014."],"interlocutory_applications":["Motion on notice for stay of execution dated and filed 9th July 2014.","Oral application to withdraw the motion for stay of execution made on 20th October 2014."],"appeals":["Appeal lodged against the judgment of 20th May 2014, entered at the Court of Appeal, record compiled and transmitted, briefs filed and exchanged."],"orders_before_trial":[],"procedural_events":["29th September 2014: Claimant/Respondent filed counter affidavit.","20th October 2014: Application came up for hearing; Defendant/Applicant sought orally to withdraw the application.","17th November 2014: Ruling delivered dismissing the application."]},"facts":{"material_facts":["The defendant/applicant filed a motion for stay of execution of the judgment of 20th May 2014 pending appeal.","The claimant/respondent filed a counter affidavit and written address.","On the hearing date, the defendant/applicant made an oral application to withdraw the motion on the ground that the Court of Appeal is seized of the matter.","A similar application for stay is pending before the Court of Appeal.","The appeal has been entered, record compiled and transmitted, and briefs exchanged."],"chronology":[{"date":"2014-05-20","event":"Judgment delivered by the National Industrial Court."},{"date":"2014-07-09","event":"Defendant/Applicant filed motion on notice for stay of execution."},{"date":"2014-09-29","event":"Claimant/Respondent filed counter affidavit."},{"date":"2014-10-20","event":"Hearing; Defendant/Applicant sought to withdraw application orally."},{"date":"2014-11-17","event":"Ruling delivered dismissing the application."}],"admitted_facts":["Both parties agree that the appeal is pending at the Court of Appeal.","Both parties agree that a similar application for stay is already filed before the Court of Appeal."],"disputed_facts":[],"background_facts":[],"employment_relationship":"","contractual_relationship":"","documentary_evidence":[],"witness_evidence":[]},"claims_and_reliefs":{"causes_of_action":[],"claims":[],"reliefs_sought":[{"relief_number":"1","relief":"An order staying the execution of the judgment delivered by this court on the 20th of May 2014 pending the hearing and determination of the appeal lodged against the said judgment.","category":"stay of execution"}],"issues_for_determination":[{"issue_number":"1","issue":"Whether the application for stay of execution should be dismissed as an abuse of court process given the pendency of a similar application before the Court of Appeal.","raised_by":"Court"}],"questions_of_law":[]},"arguments":{"claimant_arguments":["The oral application for withdrawal should be opposed; the application should be dismissed as it constitutes an abuse of court process.","The counter affidavit filed by the claimant engendered the withdrawal because the defendant saw that the application has no merit.","Filing the same application for stay at the Court of Appeal makes the one in this court a gross abuse of the process of the court.","Since the two applications pending in this court and the Court of Appeal are in respect of the same right, the process should be dismissed and not struck out."],"defendant_arguments":["The application should be withdrawn orally on the ground that the Court of Appeal being seized of the matter has robbed this court of jurisdiction to entertain the application.","The conditions of appeal have been met, the appeal duly entered, record compiled and transmitted, and briefs of argument filed and exchanged.","Since the application for stay is now pending at the Court of Appeal, this court has no jurisdiction any longer."],"appellant_arguments":[],"respondent_arguments":[],"submissions":[],"party_authorities":[{"party":"Claimant/Respondent","authority":"Anah Vs. Anah 2009 9 NWLR Pt 1091 75 at 83 at paragraph H","proposition":"Abuse of court process."},{"party":"Claimant/Respondent","authority":"Eleburuke Vs. Tawa 2010 LEPLR 40 at 98","proposition":"Abuse of court process."},{"party":"Claimant/Respondent","authority":"Arupo Vs. Aiyeleru 1993 2 SCNJ 104","proposition":"Abuse of court process."},{"party":"Defendant/Applicant","authority":"Mohammed Vs. Useni 1998 2 NWLR Pt. 584 at 141","proposition":"Jurisdiction of court."},{"party":"Defendant/Applicant","authority":"Mohammed Vs. Olawuni 1998 4 NWLR Pt. 287 P. 208 at 283","proposition":"Jurisdiction of court."}]},"evidence":{"exhibits":[],"witnesses":[],"documentary_evidence":[],"oral_evidence":[],"expert_evidence":[],"evidential_findings":[]},"judicial_analysis":{"findings_of_fact":[{"issue":"Abuse of court process","finding":"The application before the court is an abuse of court process because a similar application is pending before the Court of Appeal."}],"findings_of_law":[{"issue":"Jurisdiction","finding":"The court lacks jurisdiction to entertain the application for stay of execution since a similar application is pending before the Court of Appeal."},{"issue":"Abuse of court process","finding":"Where a proceeding is an abuse of process, the court has the right to invoke its coercive powers to punish the party by dismissing or striking out the offensive process."}],"reasoning":"The court reasoned that the pendency of a similar application before the Court of Appeal robs it of jurisdiction. It found that the application constituted an abuse of court process and that the appropriate order was dismissal rather than striking out, given that issues had been joined and the respondent had reacted to the process.","issue_analysis":[{"issue_number":"1","issue":"Whether the application for stay of execution should be dismissed as an abuse of court process given the pendency of a similar application before the Court of Appeal.","arguments":{"claimant":"The application should be dismissed as an abuse of court process; the filing of the same application at the Court of Appeal makes the one in this court a gross abuse of process.","defendant":"The application should be withdrawn because the Court of Appeal is seized of the matter and this court lacks jurisdiction."},"judicial_analysis":"The court considered the submissions and authorities. It noted that both parties agree that the appeal is pending and a similar application for stay is before the Court of Appeal. It held that this constitutes an abuse of court process and that the court lacks jurisdiction. The court cited Ekudano Vs. Keregbe on the court's discretion to dismiss or strike out, and found that dismissal was appropriate in the circumstances.","holding":"The application is dismissed as an abuse of court process.","ratio_decidendi":"Where a similar application for stay of execution is pending before the Court of Appeal, the National Industrial Court lacks jurisdiction to entertain the application and it constitutes an abuse of court process, warranting dismissal.","result":"Application dismissed."}],"holdings":[{"issue_number":"1","issue":"Whether the appli  State Public Officers Protection Law.","raised_by":"Defendants"},{"issue_number":"2","issue":"Whether the suit is an abuse of court process as it is statute barred and brought in a court without jurisdiction.","raised_by":"Defendants"},{"issue_number":"3","issue":"Whether the combination of other causes of action outside jurisdiction with one within jurisdiction robs the court of jurisdiction.","raised_by":"Defendants"},{"issue_number":"4","issue":"Whether the Public Officers Protection Law applies to a suit challenging breach of contract of employment.","raised_by":"Claimant"},{"issue_number":"5","issue":"Whether time started running from 4th January 2012 or 24th October 2012.","raised_by":"Claimant"},{"issue_number":"6","issue":"Whether there is any claim on defamation before the court.","raised_by":"Claimant"}],"questions_of_law":["Applicability of the Public Officers Protection Law to employment contracts.","Computation of limitation period for statute-barred actions."]},"arguments":{"claimant_arguments":["The Public Officers Protection Law does not apply to a suit founded on contract of employment.","The cause of action arose on 24th October 2012 when the House of Assembly passed a resolution, not on 4th January 2012.","There is no claim on defamation before the court."],"defendant_arguments":["The action is statute barred as it was filed outside the six months period allowed by section 1A of the Public Officers Protection Law.","The suit is an abuse of court process.","The combination of causes of action outside jurisdiction robs the court of jurisdiction.","The defendants are Public Officers protected by the Public Officers Protection Law."],"appellant_arguments":[],"respondent_arguments":[],"submissions":[],"party_authorities":[{"party":"Defendants","authority":"Adeyemi v Opeyori [1976] 10 SC 31","proposition":"Claims determine jurisdiction."},{"party":"Defendants","authority":"Bronik Motors v Wema Bank Nig Ltd [1983] 6 SC 158","proposition":"Claims determi onal circumstance, inability of respondent to refund judgment sum, and balance of convenience in favour of defendant.","Grounds of appeal are unanswerable in favour of applicant.","If execution is not stayed, it would be impossible for claimant to refund the judgment sum.","Preservation of the res is to prevent any judgment on appeal from being rendered nugatory.","Balance of convenience is on the applicant."],"appellant_arguments":[],"respondent_arguments":["Principles for stay of execution are laid down in cases.","Courts have discretion to grant or refuse stay, taking into account competing rights.","A winning party has a right to the fruits of his judgment.","Applicant must show special and exceptional circumstances.","Facts deposed in paragraph 4 of affidavit in support do not support any special circumstance.","The res is only a monetary claim; allowing defendant to retain judgment debt is undue advantage.","Applicant's affidavit falls short of requirements of law.","Grounds of appeal are frivolous and do not raise any substantial or recondite point of law.","Defendant participated in the whole proceeding and did not protest denial of fair hearing.","Until the National Assembly makes any other law for purpose of appealing the judgment of this court, appeal based on such law shall be by leave of the Court of Appeal.","Applicant surreptitiously tried to cling on Chapter IV of the Constitution to deceive this court.","Balance of convenience is not on the defendant's favour."],"submissions":[],"party_authorities":[{"party":"Defendant/Applicant","authority":"Amadi v. Anulabo [1992] NWLR (pt. 238) p. 721","proposition":"Grant of stay is purely at the discretion of the court."},{"party":"Defendant/Applicant","authority":"C.B.N v. Krans Thompson Org. Ltd [2002] 7 NWLR (pt. 765) p. 139","proposition":"What applicant needs to show to earn court's discretion."},{"party":"Defendant/Applicant","authority":"Baker v. Lavery [1885] 14 QBD 769","proposition":"Principles for stay of execution."},{"party":"Defendant/Applicant","authority":"The Annot Lyle [1886] 11 PD 144 at p. 166","proposition":"Principles for stay of execution."},{"party":"Defendant/Applicant","authority":"Deduwa & Ors v. Okorodudu & Ors [1974] 1 All NLR (pt. 1) p. 272","proposition":"Principles for stay of execution."},{"party":"Defendant/Applicant","authority":"Cornelius Ltd v. Ezenwa [2002] 8 NWLR (pt. 670) p. 616","proposition":"Principles for stay of execution."},{"party":"Claimant/Respondent","authority":"Okafor & Ors v. Nnaife [1987] 4 NWLR (pt. 64) p. 129","proposition":"Principles to guide court in exercise of discretion to grant stay of execution."},{"party":"Claimant/Respondent","authority":"Vincent Standard Trading Co. Ltd vs. Xtodeus Trading Co. Nig. Ltd & Ors [1993] 5 NWLR 675 at 686","proposition":"Principles for stay of execution."},{"party":"Claimant/Respondent","authority":"Union Bank Ltd v. Odusote Book Store Ltd [1994] 3 NWLR (pt. 331) p. 129","proposition":"Allowing defendant to retain judgment debt is undue advantage."},{"party":"Claimant/Respondent","authority":"Lijadu v. Lijadu [1991] 5 NWLR (pt. 169) p. 627","proposition":"Grounds of appeal must raise substantial point of law."},{"party":"Claimant/Respondent","authority":"Ajomae v. Yadant (No. 2) [1991] 5 NWLR (pt. 191) p. 266","proposition":"Grounds of appeal must raise substantial point of law."},{"party":"Claimant/Respondent","authority":"T.S.A Industrial Ltd v. Kema Investment Ltd [2006] 3 MJSC p. 1","proposition":"Grounds of appeal must raise substantial point of law."}]},"evidence":{"exhibits":[],"witnesses":[{"name":"Olushola Erinfolami","party":"Defendant/Applicant","role":"Deponent","evidence_summary":"Sworn to 12 paragraph affidavit in support of motion for stay of execution."},{"name":"John Okere","party":"Claimant/Respondent","role":"Deponent","evidence_summary":"Sworn to 9 paragraph counter affidavit opposing motion for stay of execution."}],"documentary_evidence":[],"oral_evidence": R (pt. 300) 1564","Okin Biscuits v. Oshe [2001] FWLR (pt. 41) p. 1934"]},"metadata_quality":{"extraction_confidence":0.95,"fields_missing":[],"fields_uncertain":[],"requires_review":false,"review_reasons":[],"source_completeness":"complete","ai_extraction_model":"deepseek-chat","prompt_version":"nicn-v3.2-single-call","extracted_at":"2026-10-02T10:14:35.576339+00:00"}}},{"file":"schememetadata13.json","data":{"schema_version":"nicn-ai-metadata-v3.2","source":{"court":"National Industrial Court of Nigeria","jurisdiction":"Lagos Judicial Division","source_url":"","source_id":"550","document_id":"550","file_name":"full_text.txt","downloaded_at":"","document_type":"judgment","language":"English","pages":null,"word_count":2538,"extraction_status":"complete","completeness_confidence":"HIGH"},"case":{"title":"Zenith Bank Plc v Mr Obaro Odeghe","case_number":"NICN/LA/342/2014","court":"National Industrial Court of Nigeria","judicial_division":"Lagos","judge":"Hon. Justice O.A. Obaseki-Osaghae","judgment_date":"January 12, 2016","year":2016,"claimants":["Zenith Bank Plc"],"defendants":["Mr Obaro Odeghe"],"appellants":[],"respondents":[],"applicants":[],"interested_parties":[],"counsel":[{"name":"Aanu Ogunro, with Uche Uzoagwu","represents":"Claimant"},{"name":"Elo Adhekpukoli","represents":"Defendant"}]},"procedural_history":{"originating_proceedings":"Complaint filed on 13th August 2014 by the claimant against the defendant claiming recovery of mortgage and personal loans, interest, and unamortised value of a generator.","procedural_posture":"The court raised the issue of jurisdiction suo motu and directed counsel to file written addresses. Parties adopted their written submissions on 2nd November 2015.","previous_decisions":["Judgment of the Lagos High Court in Suit No ID/1088/2009 delivered in favour of the defendant, declaring entitlement to severance benefits and striking out the claimant's counterclaim."],"interlocutory_applications":[],"appeals":[],"orders_before_trial":[],"procedural_events":["Claimant filed complaint and motion for summary judgment on 13th August 2014.","Defendant filed statement of defence and counterclaim.","Court raised jurisdiction issue suo motu.","Claimant filed written address on 24th February 2015.","Defendant filed written address on 13th April 2015.","Claimant filed reply on point of law on 9th June 2015.","Parties adopted written submissions on 2nd November 2015."]},"facts":{"material_facts":["The defendant was an employee of the claimant.","The defendant obtained mortgage loans on 31st December 2007 and 21st March 2007, and a personal loan on 29th November 2005, during his employment.","The defendant resigned from the claimant's employment on 15th January 2008.","The claimant installed a 27 KVA generator at the defendant's private residence.","The defendant instituted Suit No ID/1088/2009 at the Lagos High Court against the claimant for severance benefits.","The Lagos High Court declared the defendant entitled to severance benefits and struck out the claimant's counterclaim regarding loans and generator."],"chronology":[{"date":"14th November 2005","event":"Defendant applied for employee personal loan."},{"date":"21st November 2005","event":"Claimant approved personal loan."},{"date":"29th November 2005","event":"Defendant took personal loan of N6,000,000."},{"date":"21st March 2007","event":"Defendant took mortgage loan of N19,000,000."},{"date":"31st December 2007","event":"Defendant took mortgage loan of N30,000,000."},{"date":"15th January 2008","event":"Defendant resigned from employment."},{"date":"2009","event":"Defendant filed Suit No ID/1088/2009 at Lagos High Court."},{"date":"13th August 2014","event":"Claimant filed complaint at National Industrial Court."},{"date":"17th October 2014","event":"Defendant filed counterclaim."},{"date":"2nd November 2015","event":"Parties adopted written submissions on jurisdiction."},{"date":"12th January 2016","event":"Court delivered ruling striking out suit and counterclaim for want of jurisdiction."}],"admitted_facts":["The defendant was an employee of the claimant.","The defendant resigned from employment on 15th January 2008.","Loans were obtained during employment."],"disputed_facts":["Whether the loans are recoverable as debts.","Whether the counterclaim is res judicata.","Whether the claims are statute barred."],"background_facts":["The claimant is a bank.","The defendant was an employee of the claimant.","The loans were granted subject to conditions including immediate repayment upon resignation."],"employment_relationship":"The defendant was an employee of the claimant until his resignation on 15th January 2008.","contractual_relationship":"Employment relationship governed by an Employee Handbook, and loan agreements between employer and employee.","documentary_evidence":["Complaint and statement of facts","Statement of defence and counterclaim","Written addresses on jurisdiction","Judgment of Lagos High Court in Suit No ID/1088/2009"],"witness_evidence":[]},"claims_and_reliefs":{"causes_of_action":["Recovery of mortgage and personal loans","Recovery of interest on loans","Recovery of unamortised value of generator"],"claims":[{"claim":"Recovery of N30,000,000 principal sum of mortgage loan taken on 31st December 2007.","legal_basis":"Loan agreement","claimant":"Zenith Bank Plc","against":"Mr Obaro Odeghe"},{"claim":"Recovery of N19,000,000 principal sum of mortgage loan taken on 21st March 2007.","legal_basis":"Loan agreement","claimant":"Zenith Bank Plc","against":"Mr Obaro Odeghe"},{"claim":"Recovery of N6,000,000 principal sum of personal loan taken on 29th November 2005.","legal_basis":"Loan agreement","claimant":"Zenith Bank Plc","against":"Mr Obaro Odeghe"},{"claim":"Interest on loans totaling N55,000,000 at 21% per annum from 15th January 2008 until judgment, and thereafter at 10% per annum.","legal_basis":"Loan agreement and market rate","claimant":"Zenith Bank Plc","against":"Mr Obaro Odeghe"},{"claim":"Recovery of N952,000 being unamortised value of 27 KVA Generator.","legal_basis":"Employment benefit","claimant":"Zenith Bank Plc","against":"Mr Obaro Odeghe"}],"reliefs_sought":[{"relief_number":"a","relief":"Payment of N30,000,000 principal sum of mortgage loan.","category":"Monetary"},{"relief_number":"b","relief":"Payment of N19,000,000 principal sum of mortgage loan.","category":"Monetary"},{"relief_number":"c","relief":"Payment of N6,000,000 principal sum of personal loan.","category":"Monetary"},{"relief_number":"d","relief":"Interest on loans totaling N55,000,000 at 21% per annum from 15th January 2008 until judgment, and thereafter at 10% per annum.","category":"Monetary"},{"relief_number":"e","relief":"Payment of N952,000 being unamortised value of 27 KVA Generator.","category":"Monetary"}],"issues_for_determination":[{"issue_number":"I","issue":"Whether this Honourable Court has the jurisdiction to entertain the claimant’s suit as constituted.","raised_by":"Claimant"},{"issue_number":"II","issue":"Whether this Honourable Court has the jurisdiction to entertain the defendant’s counter claim as constituted.","raised_by":"Claimant"},{"issue_number":"I","issue":"Considering the nature of the claimant’s claim, Sections 272 and 254C (1) of the 1999 Constitution (as amended) and the final judgement of the Lagos State High Court in Suit No ID/1088/2009, does the National Industrial Court have jurisdiction to determine the claimant’s claim?","raised_by":"Defendant"},{"issue_number":"II","issue":"Considering the provisions of Section 254C (1) (k) of the 1999 Constitution (as amended), Order 18 Rule 1, of the National Industrial Court Rules, 2007, and the declaratory order of the High Court of Lagos State in Suit No ID/1088/2009 affirming the defendant’s right to his severance entitlement, does the National Industrial Court have the jurisdiction to determine defendant/counter-claimant’s counter-claim?","raised_by":"Defendant"}],"questions_of_law":["Whether the National Industrial Court has jurisdiction over claims relating to recovery of loans granted by an employer to an employee.","Whether the counterclaim is barred by the doctrine of res judicata.","Whether the claims are statute barred under the Limitation Law of Lagos State."]},"arguments":{"claimant_arguments":["The subject matter of the claim is the right of the employer to be repaid loans given to the defendant, which amounts to a debt.","The claim falls within Section 254C (1) (a) of the 1999 Constitution as amended.","The action is not statute barred because the defendant acknowledged the debt during cross-examination on 9th June 2010, within six years.","The court does not have jurisdiction to entertain the defendant’s counterclaim or to interpret the judgment of the Lagos State High Court.","The counterclaim is caught by the doctrine of res judicata.","The counterclaim is statute barred under Section 8 (1) of the Limitation Law of Lagos State."],"defendant_arguments":["The claimant’s claim has been determined in the final judgment of the Lagos High Court in Suit No ID/1088/2009, and no appeal was filed.","The National Industrial Court cannot sit on appeal over the decision of a State High Court.","The action is an abuse of the judicial process.","The claim is for recovery of mortgage sum and accrued interest arising from a simple mortgage contract, which is a banker/customer relationship, not an employment matter.","The counterclaim is a labour dispute arising from non-payment of severance benefits, which falls within Section 254C (1) of the 1999 Constitution.","The declaratory judgment of the High Court affirmed the right to 100% severance benefit, and the counterclaim seeks to ascertain the specific amount due."],"appellant_arguments":[],"respondent_arguments":[],"submissions":[],"party_authorities":[{"party":"Claimant","authority":"Thadani v National Bank of Nigeria Ltd [1972] 1 SC 75 at 80","proposition":"Where a person liable has acknowledged the debt, the right of action is deemed to have accrued on the date of acknowledgement."},{"party":"Claimant","authority":"R.A.S.C. v Akib [2006] 13 NWLR (Pt 997) 333 at 352","proposition":"Court lacks jurisdiction to interpret judgment of co-ordinate court."},{"party":"Claimant","authority":"F.R.I.N v Gold [2007] 11 NWLR (Pt 1044) 1 at 19","proposition":"Jurisdiction issue."},{"party":"Claimant","authority":"Obi v INEC [2007] 11 NWLR (Pt 1046) 560","proposition":"Jurisdiction issue."},{"party":"Claimant","authority":"Alor v Ngene [2007] 17 NWLR (Pt 1062) 163 at 177","proposition":"Striking out for lack of leave does not bar re-filing."},{"party":"Claimant","authority":"Agbasi v Obi [1998] 2 NWLR (Pt 536) 1 at 10","proposition":"Res judicata."},{"party":"Claimant","authority":"Dzungwe v Gbishe [1985] 2 NWLR (Pt 8) 528 at 537","proposition":"Res judicata."},{"party":"Claimant","authority":"Makun v F.U.T. Minna [2011] 18 NWLR (Pt 1278) 190 at 227","proposition":"Res judicata."},{"party":"Claimant","authority":"Ukaegbu v Ugoji [1991] 6 NWLR (Pt 196) 127","proposition":"Res judicata."},{"party":"Defendant","authority":"Diginyandi v INEC (No. 1) [2010] 18 NWLR (Pt 1224) 1 at 74","proposition":"Abuse of judicial process."},{"party":"Defendant","authority":"Saraki v Kotoye [1992] 7 NWLR (Pt 264) 156 at 188-189","proposition":"Abuse of judicial process."},{"party":"Defendant","authority":"Pakky Balogun v Alhaje Ode [2007] LPELR-719 (SC)","proposition":"Abuse of judicial process."},{"party":"Defendant","authority":"Dakolo v Dakolo [2011] LPELR-915 (SC)","proposition":"Abuse of judicial process."},{"party":"Defendant","authority":"African Re Corp v JDP Construction Nig Ltd [2003] 13 NWLR (Pt 838) 635","proposition":"Abuse of judicial process."},{"party":"Defendant","authority":"UBN Plc v Integrated Timber & Plywood produces [2000] LPELR-10629 (CA)","proposition":"Banker/customer relationship jurisdiction."},{"party":"Defendant","authority":"FBN v NTIA [2014] LPELR-24104","proposition":"Banker/customer relationship jurisdiction."},{"party":"Defendant","authority":"Okoya v Santilli [1990] 2 NWLR (Pt 131) 172","proposition":"Jurisdiction to ascertain amount due."}]},"evidence":{"exhibits":[],"witnesses":[],"documentary_evidence":["Complaint and statement of facts","Statement of defence and counterclaim","Written addresses","Judgment in Suit No ID/1088/2009"],"oral_evidence":[],"expert_evidence":[],"evidential_findings":[]},"judicial_analysis":{"findings_of_fact":[{"issue":"Nature of claims","finding":"The claims are in respect of mortgage and personal loans granted to the defendant during employment, and the alleged indebtedness."},{"issue":"Counterclaim","finding":"The counterclaim relates to severance benefits already determined by the Lagos High Court in Suit No ID/1088/2009."}],"findings_of_law":[{"issue":"Jurisdiction over loan recovery","finding":"The National Industrial Court lacks jurisdiction over claims relating to loans and commercial transactions, as they do not fall within Section 254C (1) (a) & (k) of the 1999 Constitution."},{"issue":"Res judicata","finding":"The counterclaim is barred by the doctrine of res judicata as the issue of severance pay was finally determined by the Lagos High Court."}],"reasoning":"The court held that jurisdiction is determined by the claimant's claim. The claims relate to recovery of loans, which are commercial transactions not connected to employment matters under Section 254C (1) (a) & (k). The counterclaim is res judicata because the Lagos High Court had already decided on severance benefits. Therefore, the court declined jurisdiction over both the suit and counterclaim.","issue_analysis":[{"issue_number":"I","issue":"Whether the National Industrial Court has jurisdiction to entertain the claimant’s suit.","arguments":{"claimant":"The claim is for recovery of loans, which is a debt and falls within Section 254C (1) (a) of the Constitution.","defendant":"The claim is a banker/customer relationship matter, not an employment matter, and the High Court has jurisdiction."},"judicial_analysis":"The court examined the claims and found they relate to loans and commercial transactions, not employment matters. Section 254C (1) (a) & (k) does not cover such claims.","holding":"The court lacks jurisdiction to entertain the claimant’s suit.","ratio_decidendi":"The National Industrial Court's jurisdiction is limited to labour and employment matters; claims for recovery of loans, even if granted during employment, are commercial transactions outside its jurisdiction.","result":"Suit struck out for want of jurisdiction."},{"issue_number":"II","issue":"Whether the National Industrial Court has jurisdiction to entertain the defendant’s counterclaim.","arguments":{"claimant":"The counterclaim is res judicata and statute barred.","defendant":"The counterclaim is a labour dispute arising from non-payment of severance benefits, which falls within Section 254C (1) (k)."},"judicial_analysis":"The court found that the issue of severance benefits was already finally determined by the Lagos High Court in Suit No ID/1088/2009. The counterclaim is an attempt to re-litigate the same issue.","holding":"The counterclaim is barred by res judicata and the court lacks jurisdiction.","ratio_decidendi":"A counterclaim that seeks to re-litigate an issue already finally determined by a court of competent jurisdiction is barred by res judicata, and the National Industrial Court lacks jurisdiction to entertain it.","result":"Counterclaim struck out for want of jurisdiction."}],"holdings":[{"issue_number":"I","issue":"Jurisdiction over claimant’s suit","holding":"The court has no jurisdiction over the suit as it relates to loan recovery, not employment matters.","result":"Struck out."},{"issue_number":"II","issue":"Jurisdiction over counterclaim","holding":"The counterclaim is res judicata and the court has no jurisdiction.","result":"Struck out."}],"ratio_decidendi":[{"issue":"Jurisdiction over loan recovery","principle":"The National Industrial Court's jurisdiction under Section 254C (1) (a) & (k) does not extend to claims for recovery of loans, which are commercial transactions.","application":"The claimant's claims for loan recovery were outside the court's jurisdiction.","holding":"Suit struck out."},{"issue":"Res judicata","principle":"A counterclaim that re-litigates an issue already decided by a court of competent jurisdiction is barred by res judicata.","application":"The counterclaim for severance benefits was already determined by the Lagos High Court.","holding":"Counterclaim struck out."}],"obiter_dicta":[],"legal_principles":[{"principle":"Jurisdiction is determined by the claimant's claim.","context":"The court considered the complaint and statement of facts.","source":"Madukolu v Nkemdilim [1962] 1 ANLR 587"},{"principle":"Res judicata bars re-litigation of issues finally determined.","context":"The counterclaim was on the same issue of severance benefits.","source":"Common law principle"}],"statutory_interpretation":[{"statute":"Constitution of the Federal Republic of Nigeria 1999 (as amended)","provision":"Section 254C (1) (a) & (k)","interpretation":"The provisions confer jurisdiction on the National Industrial Court for labour, employment, and related matters, but not for commercial transactions like loan recovery.","application":"The court found the claims did not fall within these provisions."},{"statute":"Limitation Law of Lagos State CAP L67 2003","provision":"Section 8 (1) (a)","interpretation":"Actions founded on simple contract shall not be brought after six years from accrual of cause of action.","application":"The court did not rule on this as the counterclaim was struck out for res judicata."}],"constitutional_analysis":[{"provision":"Section 254C (1) (a) & (k) of the 1999 Constitution","interpretation":"The jurisdiction of the National Industrial Court is limited to labour and employment matters, including payment or non-payment of s
