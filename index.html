nal documents and witness statement on oath."],"appeals":[],"orders_before_trial":[],"procedural_events":["Claimant filed complaint, statement of facts, witness statement on oath, list of witness, list of documents and copies of documents.","Defendant filed memorandum of appearance, statement of defence, list of witnesses, witness statement on oath, list of documents and copies of documents.","Claimant testified as CW; Emmanuel Idowu Adenipekun testified for defendant as DW.","Parties filed written addresses: defendant's dated 21st January 2014; claimant's dated 20th February 2014 but filed 21st February 2014; defendant's reply on points of law dated 4th March 2014."]},"facts":{"material_facts":["Claimant was employed by defendant.","Claimant and two other staff (Charles Ozah and Ekene Odagu) were queried for breach of audit procedure regarding issuance of Risk Assessment Reports (RARs) for certificate numbers CN/000092432/001 and CN/000092433/001.","The RARs were undervalued, causing lower import duties and loss of revenue to the Federal Government.","Claimant responded to query admitting breach of audit procedure and gross misconduct.","Claimant was summarily dismissed by letter dated 28th August 2012 for corruption.","Claimant accepted terms of dismissal letter, including discharge of defendant from all claims.","Defendant's investigation could not establish that claimant received recharge cards, but assumed she did because two others did."],"chronology":[{"date":"2012-07-03","event":"Claimant and two others allegedly sidetracked procedure for issuance of RARs."},{"date":"2012-08-07","event":"Verbal discussion between claimant and defendant regarding breach."},{"date":"2012-08-09","event":"Query issued to claimant (Exhibit C1/D1)."},{"date":"2012-08-28","event":"Claimant summarily dismissed by letter (Exhibit C2/D3)."},{"date":"2012-08-31","event":"Claimant signed acceptance of terms of dismissal letter."},{"date":"2012-11-07","event":"Claimant filed complaint at NICN."},{"date":"2013-06-04","event":"Court granted leave to amend statement of facts."},{"date":"2014-07-17","event":"Judgment delivered."}],"admitted_facts":["Claimant breached audit procedure.","Claimant admitted breach in response to query.","Claimant accepted terms of dismissal letter."],"disputed_facts":["Whether breach of audit procedure equates to corruption.","Whether claimant was afforded fair hearing.","Whether claimant received recharge cards or other inducement."],"background_facts":["Defendant is a company providing scanning services.","Claimant worked as a Ticketing and Reservation Officer with Beverly Travels Ltd at time of trial."],"employment_relationship":"Ordinary master-servant employment, not with statutory flavour.","contractual_relationship":"Contract of employment incorporating SGS Code of Integrity, Human Resources Policy Manual, and RAR Issuance Procedure.","documentary_evidence":["Exhibits C1-C6 for claimant; D1-D12 for defendant."],"witness_evidence":["Claimant testified as CW; Emmanuel Idowu Adenipekun testified as DW."]},"claims_and_reliefs":{"causes_of_action":["Unlawful summary dismissal","Breach of contract of employment","Denial of fair hearing"],"claims":[{"claim":"Declaration that summary dismissal is illegal, unlawful, null and void.","legal_basis":"Unlawful dismissal, breach of contract","claimant":"Miss Victoria Ikolomi","against":"SGS Scanning Nigeria Limited"},{"claim":"Declaration that claimant was not afforded fair hearing.","legal_basis":"Constitutional right to fair hearing","claimant":"Miss Victoria Ikolomi","against":"SGS Scanning Nigeria Limited"},{"claim":"Order compelling defendant to pay salary and entitlement up till date.","legal_basis":"Contract of employment","claimant":"Miss Victoria Ikolomi","against":"SGS Scanning Nigeria Limited"},{"claim":"N200,000.00 as special damages for solicitor's professional fees.","legal_basis":"Special damages","claimant":"Miss Victoria Ikolomi","against":"SGS Scanning Nigeria Li  and Claimant"},{"issue_number":"5","issue":"Whether having regard to the contract of employment the claimant is entitled to special damages.","raised_by":"Claimant"}],"questions_of_law":["Whether breach of audit procedure equates to corruption.","Whether fair hearing requires specific allegation to be put to employee.","Whether acceptance of terms in dismissal letter discharges employer from all claims."]},"arguments":{"claimant_arguments":["Claimant was queried for breach of audit procedure but dismissed for corruption, which she was not given opportunity to defend.","Denial of fair hearing as corruption allegation not put to her.","Dismissal based on assumption that she received recharge cards.","Entitled to general damages as dismissal letter prejudiced her job prospects.","Acceptance of terms of dismissal letter does not waive right to challenge dismissal in court.","Entitled to special damages for solicitor's fees as unchallenged."],"defendant_arguments":["Claimant's employment not with statutory flavour; remedy is damages, not reinstatement.","Claimant was afforded fair hearing through query and response.","Breach of audit procedure amounts to corruption under Code of Integrity.","Claimant admitted gross misconduct.","Claimant accepted terms of dismissal letter, discharging defendant from all claims.","Claimant not entitled to general damages or solicitor's fees.","Claimant failed to prove special damages."],"appellant_arguments":[],"respondent_arguments":[],"submissions":[],"party_authorities":[{"party":"Defendant","authority":"Chukwumah v. Shell Petroleum [1993] 4 NWLR (Pt. 289) 512","proposition":"Ordinary master-servant employment: remedy for wrongful termination is damages, not specific performance."},{"party":"Defendant","authority":"Imonikhe v. Unity Bank Plc [2011] 12 NWLR (Pt. 1262) 624 SC","proposition":"Query and answer satisfies fair hearing."},{"party":"Defendant","authority":"Guinness Nigeria Plc v. Nwoke (2000) 12 NWLR (Pt. 689) 135","proposition":"It is unethical for litigant to pass solicitor's fees to opponent."},{"party":"Claimant","authority":"Omman v. Ekpe [2001] 1 NWLR (Pt. 641) 365","proposition":"Onus on claimant to prove case on preponderance of evidence."},{"party":"Claimant","authority":"Anazodo v. Pazmeck Inter Trade [2008] All FWLR (Pt. 432) 1201","proposition":"Special damages must be pleaded and proved; unchallenged evidence sufficient."}]},"evidence":{"exhibits":[{"identifier":"C1","description":"Query issued to claimant dated 9th August 2012.","party":"Claimant","relevance":"Shows allegation of breach of audit procedure."},{"identifier":"C2","description":"Letter of summary dismissal dated 28th August 2012.","party":"Claimant","relevance":"Shows dismissal for corruption."},{"identifier":"D1","description":"Same as C1 but acknowledged receipt by claimant on 9.8.12.","party":"Defendant","relevance":"Proof of receipt of query."},{"identifier":"D2","description":"Claimant's response to query.","party":"Defendant","relevance":"Admission of breach and gross misconduct."},{"identifier":"D3","description":"Same as C2, letter of dismissal.","party":"Defendant","relevance":"Dismissal for corruption."},{"identifier":"D4","description":"Query to Charles Ozah.","party":"Defendant","relevance":"Shows similar pattern."},{"identifier":"D5","description":"Charles Ozah's reply to query.","party":"Defendant","relevance":"Admission of wrongdoing."},{"identifier":"D6","description":"Dismissal letter to Charles Ozah.","party":"Defendant","relevance":"Shows dismissal."},{"identifier":"D7","description":"Query to Ekene Odagu.","party":"Defendant","relevance":"Shows similar pattern."},{"identifier":"D8","description":"Ekene Odagu's reply to query.","party":"Defendant","relevance":"Admission of wrongdoing."},{"identifier":"D9","description":"Dismissal letter to Ekene Odagu.","party":"Defendant","relevance":"Shows dismissal."},{"identifier":"D10","description":"Human Resources Policy Manual.","party":"Defendant","relevance":"Contains clause 15.0(v) on summary dismissal."},{"identifier":"D11","description":"SGS Code of Integrity.","party":"Defendant","relevance":"Defines corruption and integrity rules."},{"identifier":"D12","description":"RAR Issuance Procedure/Channel.","party":"Defendant","relevance":"Shows procedure breached."}],"witnesses":[{"name":"Miss Victoria Ikolomi","party":"Claimant","role":"Claimant","evidence_summary":"Testified on her own behalf; admitted breach of audit procedure but denied corruption; claimed denial of fair hearing."},{"name":"Emmanuel Idowu Adenipekun","party":"Defendant","role":"Trade Analyst","evidence_summary":"Testified for defendant; stated investigation showed claimant breached audit procedure; could not establish she received recharge cards but assumed she did."}],"documentary_evidence":["Exhibits C1-C6 and D1-D12 as listed."],"oral_evidence":[],"expert_evidence":[],"evidential_findings":[{"evidence":"DW's testimony under cross-examination","finding":"Defendant could not establish that claimant received recharge cards or any inducement.","credibility":"Credible"},{"evidence":"Claimant's response to query (Exhibit D2)","finding":"Claimant admitted breach of audit procedure and gross misconduct.","credibility":"Credible"}]},"judicial_analysis":{"findings_of_fact":[{"issue":"Whether breach of audit procedure equates to corruption","finding":"Breach of audit procedure is not the same as corruption; they are separate and distinct."},{"issue":"Whether claimant received inducement","finding":"Defendant could not establish that claimant received any inducement; assumption was made."},{"issue":"Whether claimant was afforded fair hearing","finding":"Claimant was queried and responded; fair hearing satisfied."},{"issue":"Whether claimant admitted misconduct","finding":"Claimant admitted breach of audit procedure, which is disregard of rules and regulations under clause 15.0(v)."}],"findings_of_law":[{"issue":"Whether dismissal for corruption is valid when employee admitted breach of audit procedure","finding":"Dismissal for corruption not justified, but dismissal valid due to admitted breach of audit procedure amounting to serious misconduct."},{"issue":"Whether acceptance of terms of dismissal letter discharges employer from all claims","finding":"Acceptance discharges employer from all claims, including court actions."},{"issue":"Whether claimant entitled to general damages","finding":"Not entitled; no wrongful dismissal established; damages limited to salary in lieu of notice if wrongful."},{"issue":"Whether claimant entitled to solicitor's fees as special damages","finding":"Not entitled; it is unethical and against public policy."}],"reasoning":"The court found that the claimant was queried for breach of audit procedure, which she admitted. The dismissal letter stated corruption, but the court held that breach of audit procedure is not corruption. However, the dismissal was still valid because breach of audit procedure falls under disregard of rules and regulations, which is serious misconduct under clause 15.0(v). The claimant was afforded fair hearing through the query and response. The claimant accepted the terms of the dismissal letter, discharging the defendant from all claims. The claims for damages and solicitor's fees failed.","issue_analysis":[{"issue_number":"1","issue":"Whether the claimant is entitled to a declaration that her summary dismissal is illegal, unlawful, null and void; and if so, whether her contract was validly terminated.","arguments":{"claimant":"Dismissal for corruption when queried for breach of audit procedure is illegal and unlawful.","defendant":"Dismissal valid as claimant admitted gross misconduct and was afforded fair hearing."},"judicial_analysis":"The court found that corruption is not the same as breach of audit procedure. However, breach of audit procedure is disregard of rules and regulations, which is serious misconduct under clause 15.0(v). The claimant admitted this. Therefore, the dismissal is valid.","holding":"Dismissal is valid; claimant not entitled to declaration.","ratio_decidendi":"An employer can dismiss an employee for serious misconduct, including disregard of rules and regulations, even if the specific label used in the dismissal letter is inaccurate, provided the employee admitted conduct constituting serious misconduct.","result":"Relief 1 refused."},{"issue_number":"2","issue":"Whether the claimant was afforded fair hearing prior to her summary dismissal.","arguments":{"claimant":"Not afforded fair hearing as corruption allegation not put to her.","defendant":"Query and response satisfied fair hearing."},"judicial_analysis":"The claimant was queried and responded in writing. This satisfies fair hearing as per Imonikhe v. Unity Bank Plc.","holding":"Fair hearing was accorded.","ratio_decidendi":"A query given and answered satisfies the requirement of fair hearing in employment disciplinary proceedings.","result":"Relief 2 refused."},{"issue_number":"3","issue":"Whether having regard to the contract of employment the claimant is entitled to general damages.","arguments":{"claimant":"Entitled to general damages as dismissal letter prejudiced job prospects.","defendant":"Not entitled; no wrongful dismissal; damages limited to salary in lieu of notice."},"judicial_analysis":"The dismissal was valid, so no wrongful dismissal. Even if wrongful, general damages not available in ordinary master-servant employment; only salary in lieu of notice.","holding":"Not entitled to general damages.","ratio_decidendi":"In ordinary master-servant employment, damages for wrongful dismissal are limited to salary in lieu of notice; general damages for injured feelings or loss of job prospects are not recoverable.","result":"Relief 6 refused."},{"issue_number":"4","issue":"Whether having accepted the terms and conditions of the letter of dismissal, the defendant is discharged from all claims, liabilities or obligations.","arguments":{"claimant":"Acceptance does not waive right to challenge dismissal in court.","defendant":"Acceptance discharges defendant from all claims, including court actions."},"judicial_analysis":"The terms of the dismissal letter are wide enough to include court actions. The claimant accepted the terms, discharging the defendant from all claims.","holding":"Defendant discharged from all claims.","ratio_decidendi":"A valid agreement discharging an employer from all claims arising from employment bars subsequent court action by the employee.","result":"All claims barred."},{"issue_number":"5","issue":"Whether having regard to the contract of employment the claimant is entitled to special damages.","arguments":{"claimant":"Entitled to special damages for solicitor's fees as unchallenged.","defendant":"Not entitled; it is unethical and against public policy."},"judicial_analysis":"Claim for solicitor's fees as special damages fails as it is unethical and against public policy.","holding":"Not entitled to special damages.","ratio_decidendi":"A litigant cannot pass on the burden of solicitor's fees to the opponent as special damages.","result":"Relief 4 refused."}],"holdings":[{"issue_number":"1","issue":"Validity of dismissal","holding":"Dismissal valid.","result":"Relief 1 refused."},{"issue_number":"2","issue":"Fair hearing","holding":"Fair hearing accorded.","result":"Relief 2 refused."},{"issue_number":"3","issue":"General damages","holding":"Not entitled.","result":"Relief 6 refused."},{"issue_number":"4","issue":"Discharge from claims","holding":"Defendant discharged.","result":"All claims barred."},{"issue_number":"5","issue":"Special damages","holding":"Not entitled.","result":"Relief 4 refused."}],"ratio_decidendi":[{"issue":"Dismissal for misconduct","principle":"An employer can dismiss an employee for serious misconduct, including disregard of rules and regulations, even if the specific label used in the dismissal letter is inaccurate, provided the employee admitted conduct constituting serious misconduct.","application":"Claimant admitted breach of audit procedure, which is disregard of rules and regulations under clause 15.0(v).","holding":"Dismissal valid."},{"issue":"Fair hearing","principle":"A query given and answered satisfies the requirement of fair hearing in employment disciplinary proceedings.","application":"Claimant was queried and responded in writing.","holding":"Fair hearing accorded."},{"issue":"Damages for wrongful dismissal","principle":"In ordinary master-servant employment, damages for wrongful dismissal are limited to salary in lieu of notice; general damages for injured feelings or loss of job prospects are not recoverable.","application":"Claimant's employment was ordinary master-servant; no wrongful dismissal established.","holding":"General damages refused."},{"issue":"Discharge from claims","principle":"A valid agreement discharging an employer from all claims arising from employment bars subsequent court action by the employee.","application":"Claimant accepted terms of dismissal letter discharging defendant from all claims.","holding":"All claims barred."},{"issue":"Solicitor's fees","principle":"A litigant cannot pass on the burden of solicitor's fees to the opponent as special damages.","application":"Claimant claimed N200,000 as solicitor's fees.","holding":"Special damages refused."}],"obiter_dicta":[],"legal_principles":[{"principle":"Fair hearing is opportunity; query and answer satisfies it.","context":"Employment disciplinary proceedings.","source":"Imonikhe v. Unity Bank Plc [2011] 12 NWLR (Pt. 1262) 624 SC"},{"principle":"Employer can dismiss for serious misconduct including disregard of rules and regulations.","context":"Summary dismissal.","source":"Clause 15.0(v) of Human Resources Policy Manual"},{"principle":"Damages for wrongful dismissal limited to salary in lieu of notice in ordinary master-servant employment.","context":"Wrongful termination.","source":"Chukwumah v. Shell Petroleum [1993] 4 NWLR (Pt. 289) 512"},{"principle":"Solicitor's fees cannot be claimed as special damages.","context":"Costs.","source":"Guinness Nigeria Plc v. Nwoke (2000) 12 NWLR (Pt. 689) 135"}],"statutory_interpretation":[],"constitutional_analysis":[{"provision":"Section 36 of the 1999 Constitution","interpretation":"Fair hearing requires opportunity to be heard.","application":"Claimant was queried and responded, satisfying fair hearing."}],"precedent_analysis":[{"authority":"Imonikhe v. Unity Bank Plc","citation":"[2011] 12 NWLR (Pt. 1262) 624 SC","treatment":"Followed","proposition":"Query and answer satisfies fair hearing.","reasoning":"Applied to facts."},{"authority":"Chukwumah v. Shell Petroleum","citation":"[1993] 4 NWLR (Pt. 289) 512","treatment":"Followed","proposition":"Damages for wrongful dismissal limited to salary in lieu of notice.","reasoning":"Applied to facts."},{"authority":"Guinness Nigeria Plc v. Nwoke","citation":"(2000) 12 NWLR (Pt. 689) 135","treatment":"Followed","proposition":"Solicitor's fees not recoverable as special damages.","reasoning":"Applied to facts."}],"evidential_findings":[],"judicial_observations":["The court noted the repetitive numbering in defendant's written address and missing paragraphs in claimant's written address.","The court observed that the claimant's counsel's argument on issue 4 was poorly expressed."]},"authorities":{"cases_cited":[{"case_name":"Chukwumah v. Shell Petroleum","citation":"[1993] 4 NWLR (Pt. 289) 512","court":"Supreme Court","year":1993,"proposition":"Ordinary master-servant employment: remedy for wrongful termination is damages, not specific performance.","treatment":"Followed","cited_by":"Defendant","importance":"High"},{"case_name":"Co-operative Development Bank v. Essien","citation":"[2001] 4 NWLR (Pt. 704) 479","court":"Supreme Court","year":2001,"proposition":"Damages for wrongful termination.","treatment":"Cited","cited_by":"Defendant","importance":"Medium"},{"case_name":"FCDA v. Sule"," a","citation":"[2006] 2 NWLR (Pt. 964) 391","court":"Court of Appeal","year":2006,"proposition":"Employer can terminate for good or bad reason or no reason.","treatment":"Cited","cited_by":"Defendant","importance":"Medium"},{"case_name":"Commissioner for Works, Benue State v. Devcon Ltd","citation":"[1988] 3 NWLR (Pt. 83) 407","court":"Supreme Court","year":1988,"proposition":"Employer can terminate for good or bad reason or no reason.","treatment":"Cited","cited_by":"Defendant","importance":"Medium"},{"case_name":"Yusuf v. Union Bank of Nigeria Ltd","citation":"[1996] 6 NWLR (Pt. 457) 632","court":"Supreme Court","year":1996,"proposition":"Grounds for summary dismissal include gross misconduct.","treatment":"Cited","cited_by":"Defendant","importance":"Medium"},{"case_name":"Inakoju v. Adeleke","citation":"[2007] 4 NWLR (Pt. 1025) 423","court":"Supreme Court","year":2007,"proposition":"Fair hearing principles.","treatment":"Cited","cited_by":"Defendant","importance":"Medium"},{"case_name":"Maikyo v. Itodo","citation":"[2007] 7 NWLR (Pt. 1034) 443","court":"Supreme Court","year":2007,"proposition":"Burden of proving breach of fair hearing.","treatment":"Cited","cited_by":"Defendant","importance":"Medium"},{"case_name":"Imonikhe v. Unity Bank Plc","citation":"[2011] 12 NWLR (Pt. 1262) 624","court":"Supreme Court","year":2011,"proposition":"Query and answer satisfies fair hearing.","treatment":"Followed","cited_by":"Defendant","importance":"High"},{"case_name":"Guinness Nigeria Plc v. Nwoke","citation":"(2000) 12 NWLR (Pt. 689) 135","court":"Court of Appeal","year":2000,"proposition":"Solicitor's fees not recoverable as special damages.","treatment":"Followed","cited_by":"Defendant","importance":"High"},{"case_name":"SPDC Nig. v. Okonedo","citation":"[2008] 9 NWLR (Pt. 1091) 85","court":"Supreme Court","year":2008,"proposition":"Affirmed Guinness v. Nwoke.","treatment":"Cited","cited_by":"Defendant","importance":"Medium"},{"case_name":"Ifeata v. SPDC (Nig) Ltd","citati ited","cited_by":"Claimant","importance":"Medium"},{"case_name":"Obasuyi v. Business Ventures Ltd","citation":"[2000] 5 NWLR (Pt. 658) 668","court":"Supreme Court","year":2000,"proposition":"Special damages must be particularized and proved.","treatment":"Cited","cited_by":"Claimant","importance":"Medium"},{"case_name":"Combined Trade Ltd v. All States Trust Bank Ltd","citation":"[1998] 12 NWLR (Pt. 576) 56","court":"Supreme Court","year":1998,"proposition":"Cause of action determines evidence.","treatment":"Cited","cited_by":"Defendant","importance":"Medium"},{"case_name":"Daodu v. United Bank for Africa Plc","citation":"[2004] 9 NWLR (Pt. 878) 276","court":"Supreme Court","year":2004,"proposition":"Employer must establish reason for termination is within contract.","treatment":"Cited","cited_by":"Defendant","importance":"Medium"},{"case_name":"Gateway Bank of Nigeria Plc v. Abosede","citation":"[2002] 1 WRN 135","court":"Supreme Court","year":2002,"proposition":"Dismissal not wrongful unless in breach of contract.","treatment":"Cited","cited_by":"Defendant","importance":"Medium"},{"case_name":"Shell Petroleum v. Lawson Jack","citation":"[1998] 4 NWLR (Pt. 545) 249","court":"Supreme Court","year":1998,"proposition":"Damages for wrongful dismissal do not include injured feelings.","treatment":"Cited","cited_by":"Defendant","importance":"Medium"},{"case_name":"ACB Plc v. Nbisike","citation":"[1995] 8 NWLR (Pt. 416) 725","court":"Court of Appeal","year":1995,"proposition":"Employer need not allege specific misconduct at dismissal.","treatment":"Cited","cited_by":"Court","importance":"High"},{"case_name":"Ajayi v. Texaco Nig. Ltd","citation":"[1987] 3 NWLR (Pt. 62) 577","court":"Supreme Court","year":1987,"proposition":"No fixed rule on degree of misconduct for dismissal.","treatment":"Cited","cited_by":"Court","importance":"Medium"},{"case_name":"CCB (Nig.) Ltd v. Nwankwo","citation":"[1993] 4 NWLR (Pt. 286) 159","court":"Court of Appeal","year":1993,"proposition":"Mi ons can extend the limitation period."]},"arguments":{"claimant_arguments":["The cause of action accrued on 2nd September 2014 when the Defendant unequivocally stated it would not pay.","The Defendant is not entitled to protection of limitation law because it did not act in good faith.","The suit is not statute barred because time began to run from 2nd September 2014."],"defendant_arguments":["The suit is statute barred under section 136 of the Local Government Law Cap 109, Laws of Enugu State 2004, as it was filed more than six months after the cause of action accrued on 31st December 2011.","The claimants cannot jointly file this action as reliefs are personal to each claimant.","There is misjoinder of parties and causes of action."],"appellant_arguments":[],"respondent_arguments":[],"submissions":[],"party_authorities":[{"party":"Defendant","authority":"Williams v. Williams (2008) 34 NSCQR (Pt.2) 846 at 868","proposition":"Statute of limitation bars action not brought within six months."},{"party":"Claimants","authority":"Fasein v. Oyerinde (1997) 11 NWLR (Pt. 530) at 553 SC","proposition":"Defendant not entitled to protection of limitation law if not acting in good faith."}]},"evidence":{"exhibits":[],"witnesses":[],"documentary_evidence":["Pre-action notice dated 19th August 2014.","Defendant's reply letter dated 2nd September 2014."],"oral_evidence":[],"expert_evidence":[],"evidential_findings":[{"evidence":"Pre-action notice and reply letter","finding":"Cause of action arose on 31st December 2011, not 2nd September 2014.","credibility":"Accepted"}]},"judicial_analysis":{"findings_of_fact":[{"issue":"When did the cause of action accrue?","finding":"The obligation to pay severance allowance arose on 31st December 2011."},{"issue":"Was the suit filed within time?","finding":"The suit was filed on 4th November 2014, more than six months after the cause of action accrued."}],"findings_of_law":[{"issue":"Whether the suit is statute barred","finding":"The suit is statute barred under section 136 of the Local Government Law Cap 109, Laws of Enugu State 2004."},{"issue":"Whether negotiations stop time from running","finding":"Negotiations between parties cannot stop the limitation time from running."}],"reasoning":"The cause of action accrued on 31st December 2011 when the severance allowance became due. The suit was filed on 4th November 2014, beyond the six-month limitation period. The claimants' argument that time began to run from 2nd September 2014 is rejected because negotiations do not extend the limitation period. The allegation of bad faith is not supported by evidence.","issue_analysis":[{"issue_number":"1","issue":"Whether or not the suit is statute barred?","arguments":{"claimant":"Cause of action accrued on 2nd September 2014; Defendant not entitled to limitation protection due to bad faith.","defendant":"Suit statute barred under section 136 of Local Government Law; cause of action accrued on 31st December 2011."},"judicial_analysis":"The court examined the date of accrual of cause of action and found it to be 31st December 2011. The suit was filed on 4th November 2014, beyond the six-month period. Negotiations do not stop time from running. Bad faith not established.","holding":"The suit is statute barred.","ratio_decidendi":"A suit is statute barred if not filed within the time stipulated by law; negotiations do not extend the limitation period.","result":"Suit dismissed for being statute barred."},{"issue_number":"2","issue":"Whether or not the claimants can jointly file this suit as co-claimants?","arguments":{"claimant":"Claimants can jointly file as co-claimants.","defendant":"Reliefs are personal to each claimant; cannot be joint."},"judicial_analysis":"The court did not make a specific finding on this issue as the suit was dismissed on the first issue.","holding":"Not determined.","ratio_decidendi":"","result":""}],"holdings":[{"issue_number":"1","issue":"Whether or not the suit is statute barred?","holding liams","Ezean v. Nigerian Railway Corporation","Eboigbe v. NNPC"],"authorities_distinguished":[],"authorities_rejected":[],"authorities_overruled":[],"authorities_relied_upon":["Williams v. Williams","Ezean v. Nigerian Railway Corporation","Eboigbe v. NNPC"]},"metadata_quality":{"extraction_confidence":0.95,"fields_missing":[],"fields_uncertain":[],"requires_review":false,"review_reasons":[],"source_completeness":"complete","ai_extraction_model":"deepseek-chat","prompt_version":"nicn-v3.2-single-call","extracted_at":"2026-10-02T09:24:42.735460+00:00"}}},{"file":"schememetadata17.json","data":{"schema_version":"nicn-ai-metadata-v3.2","source":{"court":"National Industrial Court of Nigeria","jurisdiction":"Nigeria","source_url":"","source_id":"449","document_id":"449","file_name":"full_text.txt","downloaded_at":"","document_type":"judgment","language":"English","pages":null,"word_count":1250,"extraction_status":"complete","completeness_confidence":"HIGH"},"case":{"title":"Julian Eboh v. Metro Group Limited","case_number":"NICN/CA/668/2013","court":"National Industrial Court of Nigeria","judicial_division":"Lagos Judicial Division","judge":"Hon. Justice O.A. Obaseki-Osaghae","judgment_date":"2015-02-10","year":2015,"claimants":["Julian Eboh"],"defendants":["Metro Group Limited"],"appellants":[],"respondents":[],"applicants":["Metro Group Limited"],"interested_parties":[],"counsel":[{"name":"John Nwosu","represents":"Claimant/Respondent"},{"name":"C. Kakson","represents":"Defendant/Applicant"}]},"procedural_history":{"originating_proceedings":"Motion on notice filed by the defendant/applicant dated 31st October 2014 seeking an order striking out the suit for abuse of court process.","procedural_posture":"Ruling on a motion on notice seeking to strike out the suit for abuse of court process.","previous_decisions":[],"interlocutory_applications":["Motion on notice dated 31st October 2014 seeking to strike out the suit for abuse of court process."],"appeals":[],"orders_before_trial":[],"procedural_events":["Suit No. ID/1098/2008 was transferred from the Lagos State High Court to the National Industrial Court and listed as Suit No. NICN/LA/637/2013.","Claimant filed a notice of discontinuance in Suit No. NICN/LA/637/2013 on 13th June 2014."]},"facts":{"material_facts":["The claimant was an employee of the defendant and sustained personal injury in the course of his employment.","The defendant filed a motion to strike out the suit as an abuse of court process, alleging that Suit No. NICN/LA/637/2013 pending before Court 5 involved the same parties and subject matter.","The claimant discontinued Suit No. NICN/LA/637/2013 by a notice of discontinuance filed on 13th June 2014.","The defendant did not exhibit the originating processes in Suit No. ID/1098/2008 (now NICN/LA/637/2013)."],"chronology":[{"date":"2008","event":"Suit No. ID/1098/2008 filed at the Lagos State High Court."},{"date":"2013","event":"Suit No. NICN/CA/668/2013 filed at the National Industrial Court."},{"date":"2014-06-13","event":"Claimant filed a notice of discontinuance in Suit No. NICN/LA/637/2013."},{"date":"2014-10-31","event":"Defendant filed a motion on notice to strike out the suit for abuse of court process."},{"date":"2014-11-24","event":"Claimant filed a 17-paragraph counter-affidavit and written address."},{"date":"2015-02-10","event":"Court delivered its ruling dismissing the motion with costs."}],"admitted_facts":["The claimant filed a notice of discontinuance in Suit No. NICN/LA/637/2013 on 13th June 2014."],"disputed_facts":["Whether Suit No. NICN/CA/668/2013 constitutes an abuse of court process due to the pendency of Suit No. NICN/LA/637/2013."],"background_facts":["The claimant sustained personal injury in the course of his employment with the defendant.","The claimant's suit involves claims of personal injury, negligence, and want of duty of care."],"employment_relationship":"The claimant was an employee of the defendant.","contractual_relationship":"Employment relationship between the claimant and the defendant.","documentary_evidence":["Notice of discontinuance filed in Suit No. NICN/LA/637/2013 on 13th June 2014 (Exhibits JE1-3)."],"witness_evidence":[]},"claims_and_reliefs":{"causes_of_action":["Personal injury","Negligence","Breach of duty of care"],"claims":[{"claim":"Claim for personal injury, negligence, and want of duty of care arising from an injury sustained in the course of employment.","legal_basis":"Common law negligence and duty of care.","claimant":"Julian Eboh","against":"Metro Group Limited"}],"reliefs_sought":[],"issues_for_determination":[{"issue_number":"1","issue":"Whether this suit as presently constituted is an abuse of the process of this Honourable Court.","raised_by":"Defendant/Applicant"},{"issue_number":"1","issue":"Whether the High Court of Lagos State has the jurisdiction to transfer a case to this court.","raised_by":"Claimant/Respondent"},{"issue_number":"2","issue":"Whether this suit as it is constituted is an abuse of court process.","raised_by":"Claimant/Respondent"}],"questions_of_law":["Whether the National Industrial Court can sit on appeal over a decision of the Lagos State High Court.","Whether the transfer of a case from the Lagos State High Court to the National Industrial Court is valid."]},"arguments":{"claimant_arguments":["The High Court of Lagos State lacks jurisdiction to transfer a case to the National Industrial Court; the transfer of Suit No. ID/1098/2008 is a nullity.","The suit is not an abuse of court process because the claimant has locus standi and the statement of claim discloses a cause of action.","The claimant was unaware of the transfer and discontinued Suit No. NICN/LA/637/2013 upon discovering it.","Striking out the suit would prejudice the claimant who suffered injury and is threatened with permanent disability."],"defendant_arguments":["The suit is an abuse of court process because Suit No. NICN/LA/637/2013 pending before Court 5 involves the same parties and subject matter (personal injury, negligence, want of duty of care).","Filing two concurrent actions for the same reliefs constitutes an abuse of court process."],"appellant_arguments":[],"respondent_arguments":[],"submissions":["Defendant submitted that abuse of court process includes multiplicity of actions on the same subject matter against the same opponent.","Claimant submitted that jurisdiction is fundamental and a court acting without jurisdiction renders its judgment a nullity.","Claimant submitted that the High Court Law of Lagos State does not confer jurisdiction on the High Court to transfer a case to the National Industrial Court."],"party_authorities":[{"party":"Defendant/Applicant","authority":"Ministry of Works v. Tomas (Nig) Ltd [2002] 2 NWLR (Pt. 752) 775","proposition":"Definition of abuse of court process."},{"party":"Defendant/Applicant","authority":"Morgan v. W.A.A Engineering Co. Ltd (1971) 1 NMLR 221","proposition":"Filing two concurrent actions for same reliefs is an abuse of court process."},{"party":"Claimant/Respondent","authority":"Gombe v. P.W (Nig) Ltd & Ors [1990] 5 NWLR (Pt. 151) 473","proposition":"Jurisdiction is conferred by the Constitution or statute."},{"party":"Claimant/Respondent","authority":"Pwoza v. Jang [1992] 7 NWLR (Pt. 251) 120","proposition":"A judgment without jurisdiction is a nullity."},{"party":"Claimant/Respondent","authority":"Ndayako v. Dantoro [2004] 13 NWLR (Pt. 889) 189","proposition":"A judgment without jurisdiction is a nullity."},{"party":"Claimant/Respondent","authority":"Akegbejo & Ors v. Ataga & Ors [1998] 1 NWLR (Pt. 534) 459","proposition":"Transfer of a case without jurisdiction is invalid."},{"party":"Claimant/Respondent","authority":"Okolo v. Union Bank of Nigeria Plc [2004] All FWLR (Pt. 197) 981","proposition":"Transfer of a case without jurisdiction is invalid."},{"party":"Claimant/Respondent","authority":"Tyonzughul v. A.G Benue State [2005] 5 NWLR (Pt.918) 226","proposition":"Where a court lacks jurisdiction, the only order is striking out, not transfer."},{"party":"Claimant/Respondent","authority":"Ilori v. Benson [2000] 9 NWLR (Pt.673) 570","proposition":"Where a court lacks jurisdiction, the only order is striking out, not transfer."},{"party":"Claimant/Respondent","authority":"C.G.G Nig. Ltd v. Amaewhule [2006] 3 NWLR (Pt.967) 282","proposition":"Where a court lacks jurisdiction, the only order is striking out, not transfer."},{"party":"Claimant/Respondent","authority":"NDIC v. CBN [2002] 7 NWLR (Pt.766) 272","proposition":"Where a court lacks jurisdiction, the only order is striking out, not transfer."},{"party":"Claimant/Respondent","authority":"Ode v. Balogun [1990] 10 NWLR (Pt. 622) 214","proposition":"Abuse of court process arises from improper use of judicial process."},{"party":"Claimant/Respondent","authority":"Ali v. Albasir & Ors [2008] 3 NWLR (Pt. 1073) 94","proposition":"Abuse of court process arises from multiplicity of actions."},{"party":"Claimant/Respondent","authority":"Adesokan v. Adeogorolu [1997] 3 SCNJ P.1","proposition":"An action cannot be an abuse of court process when the claimant has locus standi and the statement of claim discloses a cause of action."}]},"evidence":{"exhibits":[{"identifier":"JE1-3","description":"Notice of discontinuance filed in Suit No. NICN/LA/637/2013 on 13th June 2014.","party":"Claimant","relevance":"Shows that the claimant discontinued the earlier suit, negating the allegation of abuse of court process."}],"witnesses":[],"documentary_evidence":["Notice of discontinuance in Suit No. NICN/LA/637/2013."],"oral_evidence":[],"expert_evidence":[],"evidential_findings":[{"evidence":"Notice of discontinuance filed by the claimant in Suit No. NICN/LA/637/2013.","finding":"The claimant discontinued the earlier suit; the parties listed on the notice are not the same as in this suit.","credibility":"Credible and uncontroverted."}]},"judicial_analysis":{"findings_of_fact":[{"issue":"Abuse of court process","finding":"The defendant failed to exhibit the originating processes in Suit No. NICN/LA/637/2013, so the court cannot ascertain multiplicity of suits. The claimant discontinued that suit, and the parties are not the same."}],"findings_of_law":[{"issue":"Abuse of court process","finding":"The suit is not an abuse of court process."},{"issue":"Jurisdiction to transfer","finding":"The National Industrial Court is a court of co-ordinate jurisdiction with the Lagos State High Court and cannot sit on appeal over the High Court's decision. The issue of validity of the transfer is for the Court of Appeal."}],"reasoning":"The defendant alleged abuse of court process due to a pending suit, but failed to provide the originating processes to substantiate the claim. The claimant showed that the earlier suit was discontinued. The court held that the suit is not an abuse of process. On the claimant's argument that the transfer from the High Court was a nullity, the court held that it cannot sit on appeal over a decision of a court of co-ordinate jurisdiction; such challenge should be made to the Court of Appeal.","issue_analysis":[{"issue_number":"1","issue":"Whether this suit as presently constituted is an abuse of the process of this Honourable Court.","arguments":{"claimant":"The suit is not an abuse of court process because the claimant has locus standi and the statement of claim discloses a cause of action; the earlier suit was discontinued.","defendant":"The suit is an abuse of court process because Suit No. NICN/LA/637/2013 involves the same parties and subject matter."},"judicial_analysis":"The defendant did not exhibit the originating processes in Suit No. NICN/LA/637/2013, so the court cannot verify the alleged multiplicity. The claimant exhibited a notice of discontinuance showing the earlier suit was discontinued, and the parties are not the same.","holding":"The suit is not an abuse of the process of court.","ratio_decidendi":"For a suit to be struck out for abuse of court process on grounds of multiplicity of actions, the applicant must provide evidence of the pending suit; a discontinued suit cannot found an allegation of abuse.","result":"Motion dismissed."},{"issue_number":"2","issue":"Whether the High Court of Lagos State has the jurisdiction to transfer a case to this court.","arguments":{"claimant":"The High Court of Lagos State lacks jurisdiction to transfer a case to the National Industrial Court; the transfer is a nullity.","defendant":"Not addressed in the ruling as the issue was raised by the claimant."},"judicial_analysis":"The National Industrial Court is a court of co-ordinate jurisdiction with the Lagos State High Court and is not empowered to sit on appeal over the decisions of the High Court. The validity of the transfer order is a matter for the Court of Appeal.","holding":"The issue is misconceived and irrelevant to the application; the court cannot sit on appeal over the High Court's order.","ratio_decidendi":"A court of co-ordinate jurisdiction cannot review or sit on appeal over the decision of another court of co-ordinate jurisdiction; such challenge must be pursued in the appellate court.","result":"Issue resolved against the claimant; motion dismissed."}],"holdings":[{"issue_number":"1","issue":"Abuse of court process","holding":"The suit is not an abuse of court process.","result":"Motion dismissed."},{"issue_number":"2","issue":"Jurisdiction to transfer","holding":"The National Industrial Court cannot sit on appeal over the Lagos State High Court's transfer order.","result":"Issue resolved against the claimant."}],"ratio_decidendi":[{"issue":"Abuse of court process","principle":"A suit cannot be struck out for abuse of court process on grounds of multiplicity of actions where the alleged pending suit has been discontinued and the parties are not the same.","application":"The claimant discontinued Suit No. NICN/LA/637/2013, and the parties on the notice of discontinuance are not the same as i ants/applicants seeking to dismiss the suit on grounds of prematurity, statute bar, and lack of jurisdiction.","previous_decisions":[],"interlocutory_applications":["Notice of preliminary objection dated 29th October 2013"],"appeals":[],"orders_before_trial":[],"procedural_events":["Claimants withdrew earlier suit instituted in 2004","Claimants filed counter affidavit and written address in opposition to the preliminary objection"]},"facts":{"material_facts":["Claimants were retired from the public service of the Federal Capital Territory at various times between 2004 and 2006.","Claimants collected their severance and disengagement benefits after retirement.","A letter dated 13th June 2007 with reference FCTA/E and T/I/S. 233 reinstated 65 disengaged staff, excluding the claimants.","Claimants filed suit on 13th June 2013 challenging their retirement and seeking reinstatement and payment of arrears."],"chronology":[{"date":"2004-2006","event":"Claimants retired from public service of the Federal Capital Territory."},{"date":"13th June 2007","event":"Letter reinstating 65 disengaged staff issued, excluding claimants."},{"date":"4th June 2013","event":"Claimants filed complaint at the National Industrial Court."},{"date":"29th October 2013","event":"Defendants filed notice of preliminary objection."},{"date":"20th December 2013","event":"Ruling delivered on preliminary objection."}],"admitted_facts":["Claimants were retired between 2004 and 2006.","Claimants collected retirement entitlements."],"disputed_facts":["Whether the retirement was irregular, illegal, and unlawful.","Whether the exclusion from reinstatement constitutes discrimination.","Whether the cause of action arose on 13th June 2007 or at the date of retirement."],"background_facts":["Claimants were public servants in the Federal Capital Territory.","Defendants are public officers and public bodies."],"employment_relationship":"Contract of employment between the claimants and the defendants (Federal Capital Territory public service).","contractual_relationship":"Employment contract.","documentary_evidence":["Letter of retirement issued to claimants.","Letter dated 13th June 2007 with reference FCTA/E and T/I/S. 233 reinstating 65 staff."],"witness_evidence":[]},"claims_and_reliefs":{"causes_of_action":["Irregular, illegal, and unlawful retirement from public service.","Discriminatory reinstatement of 65 staff excluding claimants.","Failure to reinstate claimants and pay arrears."],"claims":[{"claim":"Declaration that the retirement of the claimants is irregular, mala fide, illegal, and unlawful.","legal_basis":"Letter of retirement negates the intent of the FCT Staff Right Sizing letter dated 5th October 2005.","claimant":"Claimants","against":"Defendants"},{"claim":"Declaration that the decision to reinstate 65 disengaged staff excluding the claimants is discriminatory and violates fundamental human rights.","legal_basis":"Section 42 of the 1999 Constitution of Nigeria (as amended) and Articles 2, 12, 19 of the African Charter on Human and Peoples' Rights.","claimant":"Claimants","against":"Defendants"},{"claim":"Order of mandatory injunction compelling defendants to reinstate all claimants to their official positions.","legal_basis":"Irregular, illegal, and unlawful retirement.","claimant":"Claimants","against":"Defendants"},{"claim":"Order compelling defendants to pay all salaries, arrears of rents, allowances due from date of retirement until reinstatement.","legal_basis":"Consequential upon reinstatement.","claimant":"Claimants","against":"Defendants"}],"reliefs_sought":[{"relief_number":"1","relief":"Declaration that the retirement of the claimants is irregular, mala fide, illegal, and unlawful.","category":"Declaration"},{"relief_number":"2","relief":"Declaration that the decision to reinstate 65 disengaged staff excluding the claimants is discriminatory and violates fundamental human rights.","category":"Declaration"},{"relief_number":"3","relief":"Order of mandatory injunction compelling defendants to reinstate all claimants.","category":"Injunction"},{"relief_number":"4","relief":"Order compelling defendants to pay salaries, arrears of rents, allowances from date of retirement until reinstatement.","category":"Payment"}],"issues_for_determination":[{"issue_number":"1","issue":"Whether the Public Officers Protection Act Cap P.41 LFN 2004 is applicable to this suit as presently constituted by the claimant/respondent being contractual in nature and labour related.","raised_by":"Claimants"},{"issue_number":"2","issue":"Whether the cause of action in this suit had arisen by virtue of the document referenced: FCTA/E and T/I/S. 233 dated 13th June 2007 titled Re: Review of Appeals of disengaged staff on the 13th day of June 2007?","raised_by":"Claimants"},{"issue_number":"3","issue":"Whether this Honourable court is competent to assume jurisdiction over this suit?","raised_by":"Claimants"},{"issue_number":"4","issue":"Whether the non filing of a memorandum of appearance by the defendant/applicant in this suit is fatal to the hearing of this notice of preliminary objection?","raised_by":"Claimants"},{"issue_number":"5","issue":"Whether the 5 paragraph affidavit of Joshua Achor, in support of the notice of preliminary objection dated 6th day of July 2013 but filed on the 6th day of August 2013 is not offensive to the provision of section 115 (4) of the evidence Act.","raised_by":"Claimants"}],"questions_of_law":["Applicability of the Public Officers Protection Act to employment contracts.","Computation of limitation period for actions against public officers.","Whether failure to file memorandum of appearance precludes raising preliminary objection."]},"arguments":{"claimant_arguments":["The Public Officers Protection Act is inapplicable to this case because the claim is labour-related and contractual in nature.","The cause of action arose on 13th June 2007 when the discriminatory letter was issued, and the suit filed on 13th June 2013 is within the six-year limitation period for contracts.","The court has jurisdiction as the suit is labour-related and initiated by due process.","The failure of the defendant to file a memorandum of appearance deprives them of standing to raise a preliminary objection.","The affidavit in support of the preliminary objection is offensive to section 115(4) of the Evidence Act 2011 as it contains hearsay."],"defendant_arguments":["The action is premature and incomplete as leave of court was not sought before filing.","The action is statute barred as it was filed more than three months after the cause of action arose, contrary to section 2(a) of the Public Officers Protection Act.","The court lacks jurisdiction due to non-compliance with the enabling statute.","The claimants admitted that the cause of action accrued between 2004 and 2007, and they collected their retirement benefits.","The continuous injury exception does not apply as the contract of employment was terminated and benefits collected."],"appellant_arguments":[],"respondent_arguments":[],"submissions":[],"party_authorities":[{"party":"Defendant","authority":"Alhaja Silifat Ajilowura v. Taofik Dasu and Others","proposition":"Any application capable of terminating proceedings can be brought at interlocutory stage."},{"party":"Defendant","authority":"Patrick Izuagbe Okoto and Another v. Union Bank Ltd (2004) 1 SC Pt 1 at 30","proposition":"Action is statute barred."},{"party":"Defendant","authority":"EIMSKIP Limited v. Exquisite Industries Nig Ltd (2003) 1 SC Pt. 11 94 at 112","proposition":"Non-compliance with Public Officers Protection Act renders action a nullity."},{"party":"Defendant","authority":"Grace Jack v. University of Agriculture Markudi (2004) 1 SC Pt. 11 100 at 144","proposition":"Action statute barred."},{"party":"Claimant","authority":"Federal Govt. of Nigeria and Others v. Zebra Energy Ltd (2003) 3 WRN 1 at 11-12","proposition":"Public Officers Protection Act does not apply to contracts."},{"party":"Claimant","authority":"Ibrahim v. Judicial Service Committee (1999) 14 NWLR (Pt. 584) 1","proposition":"Public Officers Protection Act inapplicable to employment contracts."},{"party":"Claimant","authority":"Okeke v. Baba (2000) 3 NWLR Pt 650 644 at 647","proposition":"Public Officers Protection Act inapplicable to employment contracts."},{"party":"Claimant","authority":"Simeon and 183 others v. NS and CDC in suit No NIC/ABJ/141/2012","proposition":"Public Officers Protection Act inapplicable to labour matters."},{"party":"Claimant","authority":"Abiodun and Others v. The Governing Council Oyo State College of Education Oyo and I other (2009) NLLR Pt. 62 316 at 347","proposition":"Public Officers Protection Act inapplicable to employment contracts."},{"party":"Claimant","authority":"NIIA v. Ayanfalu (2007) NWLR Pt 1018 at 246-263","proposition":"Public Officers Protection Act inapplicable to employment contracts."},{"party":"Claimant","authority":"Kasau Busari and Others v. Minister of Defence and Another FHCT/ABJ/CS/184/07","proposition":"Public Officers Protection Act inapplicable to employment contracts."},{"party":"Claimant","authority":"Alhassan v. Aliyu and Others (2009) LPELR 8340","proposition":"Continuous injury exception applies."},{"party":"Claimant","authority":"Affoboche v. Ogoja Local Govt and another (2001) 36 WRN 1 at 7","proposition":"Discriminatory absorption is unjustified."},{"party":"Claimant","authority":"Okoh v. The Nigeria Navy (2007) 25 WRN 46 at 52","proposition":"Discriminatory absorption is unjustified."},{"party":"Claimant","authority":"Young v. Cross River State Judicial Service Commission (2009) 17 WRN 51 at 53-54","proposition":"Appropriate form of commencement where damages and reinstatement are involved."},{"party":"Claimant","authority":"Olumide v. Aliu (2009) 23 WRN 13 at 19-20","proposition":"Accrual of cause of action determined by originating processes."},{"party":"Claimant","authority":"Egbe v. Adefarasin (2002) 14 WRN 57","proposition":"Accrual of cause of action determined by originating processes."},{"party":"Claimant","authority":"Moumah v. Spring Bank Plc (2009) 6 WRN 118 at 121","proposition":"Accrual of cause of action determined by originating processes."},{"party":"Claimant","authority":"Anyanwoko v. Okoye (2010) 18 WRN 34 at 41","proposition":"Court competent to entertain suit."},{"party":"Claimant","authority":"Madukolu v. Nkendilim (2001) 46 WRN 1 at 2","proposition":"Court competent to entertain suit."},{"party":"Claimant","authority":"Wudi L J.P v. Aliyu (2004) 14 WRN 127 at 130","proposition":"Filing memorandum of appearance is mandatory."},{"party":"Claimant","authority":"Cooperative and Commerce Bank Nig Plc v. A.G. Anambra State and Others (1992) 8 NWLR Pt. 261 at 556","proposition":"Filing memorandum of appearance is mandatory."},{"party":"Claimant","authority":"Nuhu Sani Ibrahim v. Independent National Electoral Commission and Others (1999) 8 NWLR Pt. 614 334 at 352","proposition":"Filing memorandum of appearance is mandatory."},{"party":"Claimant","authority":"Fashawe v. A.G. Fed. (2007) 8 WRN 125 at 145","proposition":"Affidavit must comply with Evidence Act."}]},"evidence":{"exhibits":[{"identifier":"Exhibit I","description":"Circular dated 13th June 2007 referenced FCTA/E and T/I/S. 233","party":"Claimants","relevance":"Shows discriminatory reinstatement of 65 staff excluding claimants."}],"witnesses":[],"documentary_evidence":["Letter of retirement issued to claimants.","Letter dated 13th June 2007 with reference FCTA/E and T/I/S. 233."],"oral_evidence":[],"expert_evidence":[],"evidential_findings":[{"evidence":"Claimants admitted retirement between 2004 and 2006 and collection of benefits.","finding":"Cause of action accrued at date of retirement.","credibility":"Admitted fact."}]},"judicial_analysis":{"findings_of_fact":[{"issue":"Date of accrual of cause of action","finding":"Cause of action accrued when claimants were given letters of retirement between 2004 and 2006."},{"issue":"Applicability of Public Officers Protection Act","finding":"The Act applies to the defendants as public officers and to the acts complained of."}],"findings_of_law":[{"issue":"Whether leave of court is required for judicial review","finding":"No leave of court is required for judicial review under Order 22(3) of NIC Rules 2007."},{"issue":"Whether the suit is statute barred","finding":"The suit is statute barred under section 2(a) of the Public Officers Protection Act as it was filed more than three months after the cause of action arose."},{"issue":"Whether continuous injury exception applies","finding":"The continuous injury exception does not apply as the contract of employment was terminated and benefits collected."}],"reasoning":"The court held that the defendants are public officers within the meaning of the Public Officers Protection Act. The cause of action arose between 2004 and 2006 when the claimants were retired. The suit was filed on 4th June 2013, more than three months after the accrual of the cause of action. The court rejected the argument that the Public Officers Protection Act does not apply to employment contracts, distinguishing commercial contracts. The court also held that the continuous injury exception does not apply because the employment relationship had ended and benefits were collected. The court found that the suit is statute barred and dismissed it.","issue_analysis":[{"issue_number":"1","issue":"Whether the Public Officers Protection Act Cap P.41 LFN 2004 is applicable to this suit.","arguments":{"claimant":"The Act is inapplicable because the claim is labour-related and contractual.","defendant":"The Act applies as the defendants are public officers and the acts complained of were done in the course of public duty."},"judicial_analysis":"The court held that the Act applies to public officers and public bodies. The defendants are public officers. The act complained of (retirement) was done in  const rel=G.E.filter(e=>e.source===n.id||e.target===n.id).map(e=>`<li>${esc(e.rel)}${e.ctx?' — '+esc(e.ctx):''}</li>`).join('');
 const pa=n.type==='Case'?arr(M.judicial_analysis?.precedent_analysis).find(p=>norm(p.authority)===norm(n.label)):null;
 $('#side').innerHTML=`<div class="crumb"><a onclick="sel=null;draw();caseView2()">${esc(M.case.case_number)}</a> › ${esc(n.label)}</div><span class="tag">${esc(n.type)}</span><h1>${esc(n.label)}</h1>${rows}${pa?`<h2>Treatment in this judgment</h2><p><b>${esc(pa.treatment)}</b> — ${esc(pa.reasoning)}</p>`:''}${rel?`<h2>Relationships</h2><ul>${rel}</ul>`:''}${extra}${alsoHtml(n)}<p><button onclick="sel=null;draw();caseView2()">← Back to case</button></p>`}
let TXT='';
function reader(){if(!TXT){$('#side').insertAdjacentHTML('beforeend','<p class="meta">Load the case\'s full_text.txt with “Judgment text” above to read it here.</p>');return}
 $('#side').innerHTML=`<div class="crumb"><a onclick="caseView2()">← Back to case</a></div><input id="rq" placeholder="Search within judgment" style="width:100%;margin:6px 0;padding:6px;background:#0b1424;color:inherit;border:1px solid var(--ln);border-radius:6px"><div id="rt" style="white-space:pre-wrap"></div>`;
 const f=()=>{const v=$('#rq').value.trim(),h=esc(TXT);$('#rt').innerHTML=v?h.replace(new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`):h};$('#rq').oninput=f;f()}
function filters(){const types=[...new Set(G.N.map(n=>n.type))],rels=[...new Set(G.E.map(e=>e.rel.toLowerCase()))];
 $('#flt').innerHTML=[...types,...rels].map(k=>`<label><input type="checkbox" data-k="${esc(k)}" ${hidden.has(k)?'':'checked'}>${esc(k)}</label>`).join('');
 $('#flt').querySelectorAll('input').forEach(i=>i.onchange=()=>{i.checked?hidden.delete(i.dataset.k):hidden.add(i.dataset.k);draw()});}
function load(m){M=m;G=build(m);layout();sel=null;hidden=new Set();filters();caseView2();reset();play()}
let dr=null,drag=null;const sv=$('svg');
sv.onpointerdown=e=>{dr={x:e.clientX-view.x,y:e.clientY-view.y,sx:e.clientX,sy:e.clientY,m:0}};
sv.onpointermove=e=>{if(drag){const dx=(e.clientX-drag.x)/view.k,dy=(e.clientY-drag.y)/view.k;if(Math.abs(dx)+Math.abs(dy)>3)drag.m=1;if(drag.m){drag.n.x=drag.ox+dx;drag.n.y=drag.oy+dy;draw()}}else if(dr){if(Math.abs(e.clientX-dr.sx)+Math.abs(e.clientY-dr.sy)>3)dr.m=1;view.x=e.clientX-dr.x;view.y=e.clientY-dr.y;applyV()}};
sv.onpointerup=sv.onpointerleave=()=>{if(drag&&!drag.m){sel=drag.n;draw();detail(sel)}else if(!drag&&dr&&!dr.m&&sel){sel=null;draw();caseView2()}drag=null;dr=null};
sv.onwheel=e=>{e.preventDefault();const k=Math.max(.3,Math.min(3,view.k*(e.deltaY<0?1.1:.9))),b=sv.getBoundingClientRect(),px=e.clientX-b.left,py=e.clientY-b.top;view.x=px-(px-view.x)*k/view.k;view.y=py-(py-view.y)*k/view.k;view.k=k;applyV()};
$('#zi').onclick=()=>{view.k=Math.min(3,view.k*1.2);applyV()};$('#zo').onclick=()=>{view.k=Math.max(.3,view.k/1.2);applyV()};$('#rs').onclick=()=>{sel=null;draw();reset();caseView2()};$('#fc').onclick=focusNode;$('#pl').onclick=()=>{sel=null;caseView2();reset();play()};

$('#q').oninput=e=>{const v=e.target.value.toLowerCase();if($('#app').classList.contains('lib'))return renderLib(v);if(!v)return;const n=G.N.find(n=>n.label.toLowerCase().includes(v));if(n){sel=n;draw();detail(n);focusNode()}};
$('#back').onclick=$('#brand').onclick=()=>{lib();try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}};
(async()=>{try{const ix=await(await fetch('data/index.json')).json();CASES=await Promise.all(ix.map(f=>fetch('data/cases/'+f).then(r=>r.json()).then(d=>({file:f,data:d}))))}catch(e){} // zip/GitHub: loads data/cases/*.json; falls back to the embedded copy
 buildIdx();const m=(location.hash.match(/case(\d+)/)||[])[1];m!==undefined&&CASES[m]?openCase(+m):lib()})();
</script></body></html>
